openapi: 3.1.0

info:
  title: Kolearn API
  version: 0.1.0
  description: |
    API for Kolearn, a TOPIK exam-prep platform.

    Covers Phase 1's thin slice: browse exams, take one, submit, read the
    result, review each answer with its five explanation layers, tag topics,
    and turn wrong answers into review cards.

    Two conventions run through the whole surface:

    **Errors are RFC 9457 problem+json.** Every non-2xx response — including
    unmatched routes — has `type`, `title`, `status`, and `code`. Some carry
    extension members: a 409 from `POST /attempts` includes the in-progress
    attempt so the client can render its confirmation dialog without a second
    request.

    **A machine-derived score never appears as a bare number.** Bands and
    writing scores are `EstimatedBand` / estimate-tagged objects that carry
    their own disclaimer, so a client cannot render the value without having
    been handed the caveat.

servers:
  - url: /api/v1

tags:
  - name: auth
  - name: catalog
  - name: attempt
  - name: review
  - name: topics
  - name: cards
  - name: weakness
  - name: placement
  - name: writing
  - name: shadowing
  - name: dictation
  - name: wordbook
  - name: assistant
  - name: studio
  - name: admin

security:
  - bearerAuth: []

paths:
  # ── auth ──────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Created. A verification email is sent; in dev it is logged to stdout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in. The refresh token is set as an httpOnly cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      security: []
      summary: Exchange the refresh cookie for a new access token
      description: |
        Rotates the refresh token. Presenting one that has already been rotated
        means it leaked, so the entire token family is revoked and this returns
        401 — the legitimate holder is signed out too, which is the intended
        outcome when a session is known to be compromised.
      responses:
        '200':
          description: Rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': { description: Signed out; the refresh family is revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Verified. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      security: []
      description: |
        Always returns 204, whether or not the address is registered. Reporting
        which addresses exist would turn this into an account-enumeration
        oracle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: Accepted. }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 10 }
      responses:
        '204': { description: Reset; all sessions revoked. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      responses:
        '200':
          description: The signed-in learner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── catalog ───────────────────────────────────────────────────────────────

  /exams:
    get:
      tags: [catalog]
      operationId: listExams
      summary: Browse exams (YC-101)
      description: |
        Each entry carries the caller's own attempt count and best score, which
        is what the list screen shows beside each exam.
      parameters:
        - { name: level, in: query, schema: { $ref: '#/components/schemas/ExamLevel' } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: A page of exams.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExamListItem' }
                  nextCursor: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /exams/{examId}:
    get:
      tags: [catalog]
      operationId: getExam
      summary: Exam detail for the entry screen
      parameters:
        - $ref: '#/components/parameters/ExamId'
      responses:
        '200':
          description: Exam with its section layout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── attempt ───────────────────────────────────────────────────────────────

  /attempts:
    post:
      tags: [attempt]
      operationId: startAttempt
      summary: Start an attempt
      description: |
        Fails with 409 when the learner already has one in progress (R-03).
        The problem response carries the existing attempt under
        `inProgressAttempt`, so the client can render TCCN-106-5's
        "Bạn còn bài dở ở Đề 83" dialog without a second request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartAttemptRequest' }
      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptRunner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: An attempt is already in progress.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AttemptInProgressProblem' }
        '422':
          description: |
            An unusable section selection — sent in EXAM mode, empty, or naming
            a section this exam does not have.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /attempts/current:
    get:
      tags: [attempt]
      operationId: getCurrentAttempt
      summary: The in-progress attempt, if any
      responses:
        '200':
          description: The attempt in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptRunner' }
        '204': { description: Nothing in progress. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /attempts/{attemptId}:
    get:
      tags: [attempt]
      operationId: getAttempt
      summary: The attempt payload for the runner screen
      description: |
        Returns every question at once — a TOPIK paper is at most 50 questions,
        so question navigation is a state transition with no network call
        (Q-01, under 100ms).

        This response NEVER carries correctness, distractor explanations, or
        evidence, in either mode. TCCN-103-6 is not a presentation concern: a
        learner who opens the network tab must find nothing that reveals an
        answer. Those fields live only on the review response, which requires a
        submitted attempt.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Runner payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptRunner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [attempt]
      operationId: updateAttempt
      summary: Update runner state (current question, settings)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentQuestionId: { type: string, format: uuid }
                translationVisible: { type: boolean }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /attempts/{attemptId}/answers/{questionId}:
    put:
      tags: [attempt]
      operationId: recordAnswer
      summary: Record an answer or flag (YC-103, R-03)
      description: |
        Idempotent and last-write-wins by `clientSeq`, so a retry that arrives
        out of order cannot overwrite a newer answer with an older one.

        A null `selectedChoiceOrdinal` clears the answer back to *bỏ qua*.
        Returns 409 once the attempt or its section is submitted — the database
        refuses the write regardless of what the handler believes (R-04).
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordAnswerRequest' }
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnswerState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /attempts/{attemptId}/submit:
    post:
      tags: [attempt]
      operationId: submitAttempt
      summary: Submit and score (YC-105, YC-107)
      description: |
        Scores in one transaction and freezes the attempt. Submitting an
        already-submitted attempt returns its existing result rather than an
        error, so a double tap or a retried request is harmless.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Scored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attempts/{attemptId}/abandon:
    post:
      tags: [attempt]
      operationId: abandonAttempt
      summary: Give up an attempt without scoring it (R-03, TCCN-106-5)
      description: |
        Marks the attempt bỏ dở. It is never scored, and it stays in history
        with that label exactly as a lapsed one does (TCCN-106-4, TCCN-111-3).

        R-03 allows one live attempt, so this is what a learner who wants to
        sit a different paper has to do first. It is deliberately its own call
        rather than a flag on `startAttempt`: the 409 there stays
        unconditional, and discarding work is never a side effect of asking
        for something else.

        Abandoning an already-abandoned attempt succeeds, so a double tap or a
        retried request is harmless. A submitted one cannot be abandoned —
        there is nothing to give up, and it is not blocking anything.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '204': { description: Abandoned. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The attempt has already been submitted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /attempts/{attemptId}/result:
    get:
      tags: [attempt]
      operationId: getAttemptResult
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The attempt has not been submitted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ── review ────────────────────────────────────────────────────────────────

  /attempts/{attemptId}/questions/{questionId}/audio:
    get:
      tags: [attempt]
      operationId: getQuestionAudio
      summary: Stream the listening audio for one question (YC-110, R-01)
      description: |
        **The fallback path.** A deployment with a public bucket sends
        `passage.audioPublicUrl` instead and the client reads the clip from the
        CDN, which costs no request at all; this route is what a deployment
        without one uses, and what a client holding an older payload uses.

        Authenticated and per-attempt, which is what lets it enforce R-01 in
        the one place a rule can be enforced — the request itself. That is the
        capability the public URL gives up: a shareable link is a rule the
        client is merely asked to respect, and a learner who opens the network
        tab gets unlimited replays with nothing failing. It was given up
        deliberately, to buy back the three round trips that ran on the
        section's clock before the first sound.

        The first EXAM-mode request records an `AUDIO_PLAYED` event. A second
        one is refused with 409 — including after a page reload, which is what
        stops a refresh from buying another listen. On the CDN path the client
        reports that event itself and honours the refusal itself; the server
        reads the events back as `passage.audioPlayed` so a reload still lands
        on the right screen.

        PRACTICE mode is unlimited and answers range requests, so the player
        can seek.

        This route serves the bytes and records the play in one request, which
        is what makes a browser client wait for the whole file before anything
        sounds — see `createAudioTicket` for the split-in-two path that does
        not.

        In PRACTICE this answers `302` with a signed address where storage can
        sign one, so the clip comes straight from object storage. In EXAM it
        always answers with the bytes: the play is charged before the response
        on this route, so a client that failed to follow a redirect would have
        paid for a listen it never received, which R-12 forbids. The ticket pair
        does not have that problem — a ticket can simply be presented again —
        which is where an exam clip should be fetched from anyway.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: The audio stream.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/mp4:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
        '302': { $ref: '#/components/responses/ClipRedirect' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No audio for this question, or the attempt is not the caller's.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Already played once, and this attempt is in EXAM mode.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /attempts/{attemptId}/questions/{questionId}/audio-ticket:
    post:
      tags: [attempt]
      operationId: createAudioTicket
      summary: Spend the listen and get a streamable URL (YC-110, R-01)
      description: |
        The same single listen as `getQuestionAudio`, bought so that playback can
        begin before the clip has finished downloading.

        `getQuestionAudio` needs a bearer token, and an `<audio>` element cannot
        send one — so a browser client has to `fetch()` the clip into a Blob
        first, and a Blob has no first chunk to play. On a phone on mobile data
        that wait runs on the section's clock, and it grows with the length of
        the recording.

        **POST, because this is the state change.** This call is what records
        `AUDIO_PLAYED`, in exactly the place the first byte-serve recorded it
        before, and everything that used to hang off "the first request" hangs
        off this one: the passage-scoped count, the 409 on the second listen,
        R-12's retry after a reported `AUDIO_LOAD_FAILED`, and the stalled-clock
        grant. The byte route it points at records nothing.

        The play is therefore charged before a single byte is asked for. That is
        deliberate: a byte route that served without a play on record would let
        anyone with a network tab download every clip in the paper and replay
        them locally for the rest of the section, and the one-play rule would
        still be in the code without being true.

        The returned URL is redeemable **many times** inside its window. One
        playback is not one HTTP request — a browser probes with a tiny range
        first, fetches the body, then asks again on every buffer refill.

        PRACTICE mode may mint as many tickets as it likes, as it may replay
        freely.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: The ticket, and when it stops working.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AudioTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No audio for this question, or the attempt is not the caller's.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            Already played once, and this attempt is in EXAM mode. The same
            problem body `getQuestionAudio` answers with.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /attempts/{attemptId}/questions/{questionId}/audio-stream:
    get:
      tags: [attempt]
      operationId: streamTicketedAudio
      security: []
      summary: The bytes a play ticket was minted for (YC-110)
      description: |
        Authenticated by the ticket alone — no bearer token — so the URL can go
        straight into `<audio src>`. Nothing here records a play: the listen was
        spent by `createAudioTicket`, which is why this can answer the several
        requests one playback actually makes.

        Where object storage can sign addresses this answers `302` and the
        player fetches the clip directly; otherwise it answers `200` with the
        bytes, `Range` with `206` and `Content-Range`. A media element follows
        the redirect on its own and re-sends `Range` against the target, so a
        client written against the `200` needs no change.

        Either way it sends `Cache-Control: no-store`, and so does the object
        behind the signed address. The no-store is load-bearing rather than
        hygiene: R-01 used to be enforced partly by accident, because the client
        held the clip in an object URL that a reload dropped. A URL in
        `<audio src>` would otherwise sit in the browser's HTTP cache, where a
        reload inside the ticket window could replay it without asking anyone.

        A ticket presented against another attempt's or another passage's URL is
        `404`, the same answer as a question with no audio, and no address is
        signed for it. An expired ticket is `410` and never `409`: a spent
        listen and a stale link mean opposite things to the learner, and only
        one of them offers a retry.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/QuestionId'
        - name: ticket
          in: query
          required: true
          description: The opaque value from `createAudioTicket`.
          schema: { type: string }
      responses:
        '200':
          description: The whole clip.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/mp4:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
        '206':
          description: The requested byte range.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/mp4:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
        '302': { $ref: '#/components/responses/ClipRedirect' }
        '404':
          description: |
            No audio for this question, or the ticket was issued for a different
            attempt or passage.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: |
            The ticket has expired, or is unknown. Distinct from the 409 a
            refused replay answers with — this one is worth pressing play again.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /attempts/{attemptId}/questions/{questionId}/review-audio:
    get:
      tags: [review]
      operationId: getReviewAudio
      summary: Replay a listening clip after the paper is submitted (YC-114, TCCN-114-2)
      description: |
        The same bytes as `getQuestionAudio`, under the opposite rule: unlimited
        replays, no play recorded, range requests answered so the player can
        seek to the moment the explanation cites.

        R-01's single play governs **sitting** the paper, not studying it
        afterwards — `TCCN-114-2` says so in as many words. Without this route
        a learner who misheard a listening question can never hear it again,
        which is the one thing the review screen exists to make possible.

        A separate operation rather than a mode inside `getQuestionAudio`: that
        one exists to enforce the single play, and a rule with an exception
        threaded through it is a rule with a bug waiting in the exception. This
        route requires the attempt to be **submitted** and refuses anything
        else, so no path through it can hand out replays mid-exam.

        Cacheable, and deliberately so: `private, max-age=3600` with the asset's
        SHA-256 as a strong `ETag`. Unlimited replays are the feature, and
        without a validator the third and fourth replay are three more downloads
        of a clip the browser already holds.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: |
            The audio stream, with `Accept-Ranges: bytes`, an `ETag`, and
            `Cache-Control: private, max-age=3600`.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/mp4:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
        '302': { $ref: '#/components/responses/ClipRedirect' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No audio for this question, or the attempt is not the caller's.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The attempt has not been submitted, so there is nothing to review.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /attempts/{attemptId}/media/{assetId}:
    get:
      tags: [attempt]
      operationId: getAttemptImage
      summary: Fetch an image used by a passage or answer choice
      description: |
        The asset must belong to a question in the caller's frozen attempt.
        Images are available both while sitting and while reviewing a paper;
        unlike listening audio, fetching them is not subject to a play limit.

        Where a public media bucket is configured this answers `302` and the
        picture is fetched from the CDN — and the runner payload carries that
        CDN address directly, so a current client never calls this route at all.
        It remains for clients holding an older payload.

        Without a public bucket it serves the bytes, cacheable:
        `private, max-age=3600` with the asset's SHA-256 as a strong `ETag`.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/AssetId'
      responses:
        '200':
          description: |
            The image bytes, with an `ETag` and
            `Cache-Control: private, max-age=3600`. Sent only when this
            deployment has no public bucket; otherwise see `302`.
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '302': { $ref: '#/components/responses/MediaRedirect' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The image is absent, is not an image, or does not belong to the caller's attempt.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /attempts/{attemptId}/sections/{kind}/submit:
    post:
      tags: [attempt]
      operationId: submitSection
      summary: Close one section (R-04, YC-105)
      description: |
        A submitted section cannot be returned to. That is enforced by a
        trigger on `attempt_answers` rather than by this endpoint, so it holds
        against a client that forgot, a replayed offline write, and a request
        made by hand.

        Closing the last open section finishes the attempt, and the response
        carries the result — leaving a paper IN_PROGRESS with every section
        closed would be a state the learner cannot act on.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - name: kind
          in: path
          required: true
          schema: { $ref: '#/components/schemas/SectionKind' }
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema:
                type: object
                required: [finished]
                properties:
                  finished:
                    type: boolean
                    description: True when that was the last open section.
                  result: { $ref: '#/components/schemas/AttemptResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already submitted, or the attempt is no longer in progress.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /attempts/{attemptId}/sections/{kind}/pause:
    post:
      tags: [attempt]
      operationId: pauseSection
      summary: Stop the PRACTICE clock (TCCN-105-1)
      description: |
        PRACTICE only, and the 409 for EXAM is R-01 rather than an oversight:
        an exam clock that can be paused is not an exam clock. TCCN-106-2 says
        closing the browser for twelve minutes costs twelve minutes, and a
        pause button would be a supported way around exactly that.

        The elapsed time is banked on the way out, so the total survives any
        number of pauses. Pausing an already-paused section changes nothing.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - name: kind
          in: path
          required: true
          schema: { $ref: '#/components/schemas/SectionKind' }
      responses:
        '204': { description: Paused. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: EXAM mode, or the section or attempt is no longer open.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /attempts/{attemptId}/sections/{kind}/resume:
    post:
      tags: [attempt]
      operationId: resumeSection
      summary: Start the PRACTICE clock again (TCCN-105-1)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - name: kind
          in: path
          required: true
          schema: { $ref: '#/components/schemas/SectionKind' }
      responses:
        '204': { description: Running. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: EXAM mode, or the section or attempt is no longer open.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /attempts/{attemptId}/events:
    post:
      tags: [attempt]
      operationId: recordAttemptEvent
      summary: Record what happened during an attempt (R-12)
      description: |
        Append-only telemetry. The event that carries a rule is
        `AUDIO_LOAD_FAILED`: after the learner has retried and the audio still
        will not play, the client records `AUDIO_SKIPPED_SYSTEM_ERROR` and the
        question is scored as VOIDED rather than wrong. R-12 is explicit that
        our failure must not count against the learner, and voided questions
        leave the denominator entirely.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttemptEventRequest' }
      responses:
        '204': { description: Recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /attempts/{attemptId}/retry-wrong:
    post:
      tags: [attempt]
      operationId: retryWrong
      summary: Practise the questions this attempt missed (YC-122)
      description: |
        Creates a PRACTICE attempt holding exactly the questions that were not
        answered correctly — wrong ones and blank ones both, because running
        out of time is not evidence a learner knew the answer.

        Always PRACTICE, and always without a band: a subset of a paper has no
        blueprint and no honest total, so a level cannot be estimated from it.

        The questions come from the origin attempt's own snapshot rather than
        from the exam, so a redo asks what was actually asked even if the bank
        has been edited since (GĐ-3).
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '201':
          description: The redo, ready to sit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptRunner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Nothing was wrong, the attempt is not submitted, or another attempt
            is already in progress.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AttemptInProgressProblem' }

  /me/attempts:
    get:
      tags: [attempt]
      operationId: listAttemptHistory
      summary: Past attempts, the two modes apart (YC-111)
      description: |
        Newest first. `mode` is reported on every row and can be filtered on,
        because the two must never be merged into one ranking: a PRACTICE score
        is higher simply because the clock was not running, so a mixed list
        would show a learner improving when they had only stopped being timed.

        Abandoned attempts stay in the list with that status. History that
        quietly disappears is indistinguishable from lost work.

        No band appears here. A level beside a score in a list invites exactly
        the reading điều cấm #1 forbids; it belongs on the result screen, inside
        the one component that always renders its disclaimer with it.
      parameters:
        - { name: mode, in: query, schema: { $ref: '#/components/schemas/AttemptMode' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: The learner's attempts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AttemptHistoryRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /attempts/{attemptId}/review:
    get:
      tags: [review]
      operationId: reviewAttempt
      summary: Answer review with the five explanation layers (YC-108, 112, 113)
      description: |
        Defaults to `wrong`, because that is why the learner opened this screen
        (TCCN-108-2).

        An explanation layer with no authored content is **omitted from the
        response entirely** — not null, not an empty string. R-07 requires the
        client to hide the block rather than render an empty frame or a
        "chưa có" line, and the cheapest way to guarantee that is to give the
        client nothing to render.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, wrong, skipped, flagged]
            default: wrong
      responses:
        '200':
          description: Reviewed questions.
          content:
            application/json:
              schema:
                type: object
                required: [items, counts]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReviewQuestion' }
                  counts: { $ref: '#/components/schemas/ReviewCounts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The attempt has not been submitted.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /attempts/{attemptId}/topic-summary:
    get:
      tags: [review]
      operationId: getAttemptTopicSummary
      summary: This attempt's topics by frequency (TCCN-108-5)
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Topics for this attempt, most-missed first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AttemptTopicSummaryRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── topics ────────────────────────────────────────────────────────────────

  /topics:
    get:
      tags: [topics]
      operationId: listTopics
      summary: Topic suggestions for tagging
      parameters:
        - { name: category, in: query, schema: { $ref: '#/components/schemas/TopicCategory' } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Matching topics, curated ones first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Topic' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [topics]
      operationId: createTopic
      summary: Create a topic, or resolve to an equivalent existing one
      description: |
        Returns 200 with the existing topic when the name normalises to one
        already present, and 201 only when a genuinely new topic was created.
        Two topics differing by spacing or case would split one weakness across
        two rows of the analysis table (R-06, TCCN-108-11).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, name]
              properties:
                category: { $ref: '#/components/schemas/TopicCategory' }
                name: { type: string, minLength: 1 }
      responses:
        '200':
          description: An equivalent topic already existed; it is returned unchanged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /attempts/{attemptId}/questions/{questionId}/topics:
    put:
      tags: [topics]
      operationId: setQuestionTopics
      summary: Set the topics for one question in this attempt (YC-108, R-06)
      description: |
        Sets the complete topic set for the question. Because the error log is
        append-only, the server applies this as a diff rather than a replace:
        newly added topics are inserted as entries, removed ones are recorded
        as retractions. Untagging never deletes history (điều cấm #2).

        Entries are written for correct answers too, marked as such — without
        the denominator, "wrong 8 times" cannot become "wrong 8 of the 11 times
        you met it" (TCCN-108-7).
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topicIds]
              properties:
                topicIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionTopicsResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── cards ─────────────────────────────────────────────────────────────────

  /cards:
    post:
      tags: [cards]
      operationId: createCard
      summary: Create a review card (YC-109)
      description: |
        Returns 200 with the existing card and `alreadyExisted: true` when the
        learner already has one for this term, rather than an error —
        TCCN-109-2 wants "đã có trong bộ X" plus a link to it, which is
        information, not a failure.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCardRequest' }
      responses:
        '200':
          description: |
            The card, whether it was just created or already existed —
            `alreadyExisted` is what tells the two apart. One status for both
            because the caller does the same thing either way, and a 201 here
            would be a second signal carrying no extra information.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /cards:batch:
    post:
      tags: [cards]
      operationId: createCardsBatch
      summary: Create cards for several terms at once (TCCN-109-3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cards]
              properties:
                cards:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/CreateCardRequest' }
      responses:
        '200':
          description: Reports how many were created and how many already existed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardBatchResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /cards/{cardId}/state:
    put:
      tags: [cards]
      operationId: setCardState
      summary: Mark a card Mới, Đang học or Đã nhớ (R-15)
      description: |
        The learner decides, and nothing computes anything on their behalf:
        R-15 is explicit that there is no interval, no ease factor and no next
        review date. Marking a card Đã nhớ is the only way it leaves the daily
        list, and marking it back to Đang học is allowed at any time.

        PUT rather than PATCH because the body is the whole value of one thing,
        which makes a replay harmless — marking is a tap on a phone, and the
        retry of a request that already landed must not mean anything different
        the second time.

        Reachable from the collection screen, not only from a review session
        (R-15, ràng buộc 3).
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: '#/components/schemas/CardState' }
      responses:
        '200':
          description: The card, with the state it now has.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /me/cards:
    get:
      tags: [cards]
      operationId: listMyCards
      summary: The cards this learner has collected (YC-109)
      description: |
        Newest first. The read half of YC-109: until this existed,
        TCCN-109-2's "đã có trong bộ X" had no X to link to, and every card the
        app created went somewhere nobody could look.

        **No scheduling state is returned** — not `intervalDays`, not
        `easeFactor`, not `dueAt`. R-15 forbids the algorithm that would move
        them, so the columns exist and nothing writes them; every card would
        report the same three constants, and a constant on the wire is a field
        a client renders as though it meant something. `state` is here because
        R-15 makes it the learner's own answer rather than a scheduler's.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: |
            The learner's cards, always as an array — an empty collection is a
            designed state with its own copy (R-13), not an absence.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MyCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/cards/study:
    get:
      tags: [cards]
      operationId: listStudyCards
      summary: The cards to review now (R-15)
      description: |
        Every card the learner has not yet marked Đã nhớ, with Đang học before
        Mới — R-15's "Ưu tiên thứ đang dở hơn thứ chưa bắt đầu". Nothing is
        scheduled and nothing is computed: the rule is explicit that there is
        no interval, no ease factor and no next review date.

        Its own operation rather than a flag on `GET /me/cards`, because the
        two differ in their *ordering policy* and a rule with an exception
        threaded through it is a rule with a bug waiting in the exception —
        the same reason `getReviewAudio` is not a mode of `getQuestionAudio`.

        Deliberately not named `/due` or `/today`: both would name machinery
        R-15 removed. There is no due date and no daily rollover — this list is
        identical every day until the learner marks something. R-15 calls it
        "danh sách ôn hằng ngày" for how it is used, not how it is computed.

        **One response is one session.** `limit` is the learner's configured
        session size rather than a page size, and there is no cursor. That is
        deliberate: the sort key includes `state`, which reviewing is the act
        of changing, so a card marked Mới → Đang học moves backwards past any
        cursor and would never be seen again that day.
      parameters:
        - name: limit
          in: query
          description: |
            The learner's cards-per-session setting. Out of range falls back to
            the default rather than erroring — a stale client is not worth a
            422 on a read.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: |
            The session, always as an array. Nothing left to review is a
            designed state with its own copy (R-13) — and on this screen it is
            good news, not an absence.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MyCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── weakness ──────────────────────────────────────────────────────────────

  /me/weakness:
    get:
      tags: [weakness]
      operationId: getWeakness
      summary: Cumulative weakness by topic (TCCN-108-6)
      description: |
        One row per topic across every attempt, with the multiple-choice and
        writing counts attributed separately on the same row (TCCN-206-1).
        Topics with repeat wrong answers sort first — a mistake that survived a
        retry is the highest-value thing to study next (R-08).

        `items` is a *ranked cut*, so `categories` is returned beside it with the
        same totals gathered per nhóm over the whole table. Summing `items` is
        not equivalent whenever `limit` truncated: the ordering puts the wrong
        answers first, so a group keeps its numerator and loses part of its
        denominator, and every severity bar drawn from it reads high.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: The weakness table.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WeaknessRow' }
                  categories:
                    type: array
                    description: |
                      One row per nhóm the learner has weaknesses in, totalled
                      over every chủ điểm rather than the ones `limit` let
                      through. Never affected by `limit`.

                      Optional in the schema although this server always sends
                      it. The learner app deploys separately from this one, so
                      there is a window where a new client reaches an old
                      instance; declaring it required would have the generated
                      type assert something false for the length of a rolling
                      deploy, and push the client's fallback outside what the
                      types can check. Summing `items` is that fallback, and it
                      is correct whenever the response was not truncated.
                    items: { $ref: '#/components/schemas/WeaknessCategoryRow' }
                  insufficientData:
                    type: boolean
                    description: |
                      There is not yet enough behind this learner to name a
                      weakness, so `items` and `categories` are empty on
                      purpose (TCCN-541-5): the screen says "Chưa đủ dữ liệu để
                      chỉ ra điểm yếu" and offers one thing that can be done
                      right now.

                      A flag rather than an inference from two empty arrays,
                      because they mean different things. Empty with this false
                      is "you have made no mistakes we can group"; empty with it
                      true is "you have not done enough for us to tell", and
                      only the second owes the learner a next step.

                      The thresholds behind it are rows in `weakness_policies`,
                      not constants — a bank of five papers and a bank of fifty
                      do not agree about how much is enough.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/weakness/topics/{topicId}/recommendations:
    get:
      tags: [weakness]
      operationId: getTopicRecommendations
      summary: Ôn lại — what this chủ điểm opens onto (YC-541, YC-542)
      description: |
        The đề xuất panel for one chủ điểm of the weakness table. Two blocks,
        never merged, câu chưa từng gặp always first:

        1. **Câu chưa từng gặp** — questions on this chủ điểm from the bank the
           learner has never been served, in any attempt.
        2. **Làm lại câu đã sai** — the questions they actually got wrong on it,
           gathered across every sitting rather than within one (R-08).

        The split is a constraint and not a way of laying out a list. Redoing
        the exact questions already missed mostly measures whether the answer
        is remembered, not whether the pattern is understood; merging the two
        lets a learner answer six remembered questions correctly and conclude
        they have it, while a new question still goes wrong (YC-542).

        A block with nothing behind it is **absent**, never present with a zero
        and never padded with off-topic questions to look full. An empty
        `blocks` is the state where the screen says "Chưa có bài tập cho chủ
        điểm này" and offers something else.

        No model is called and no `R-11` quota is charged, however many times
        the panel is reopened (TCCN-541-3): both counts are joins over chủ điểm
        already attached to questions (R-06) and độ khó already assigned by
        hand (YC-303).
      parameters:
        - name: topicId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: What each block would open. Unseen first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopicRecommendations' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/weakness/topics/{topicId}/practice:
    post:
      tags: [weakness]
      operationId: startTopicPractice
      summary: Open one block as a lượt Luyện tập (YC-542)
      description: |
        Creates a PRACTICE attempt holding the questions of the chosen block.

        Always PRACTICE and always without a band. The questions come from
        several papers at once, so the run has no blueprint of its own and no
        honest total: "không quy đổi cấp độ, vì không phải đề đầy đủ"
        (TCCN-542-2). It is scored and logged like any other run — a question
        still wrong is marked sai lặp lại by the same rule (R-08), and the
        error log gains rows rather than having any rewritten, so returning to
        the weakness screen shows the fraction moved (TCCN-545-1).

        R-03 still holds: one live attempt at a time. A learner with an
        unfinished run gets the same 409 and the same `inProgressAttempt` as
        every other way of starting one.
      parameters:
        - name: topicId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [block]
              properties:
                block: { $ref: '#/components/schemas/PracticeBlockKind' }
      responses:
        '201':
          description: The run, ready to sit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptRunner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Another attempt is already in progress, or the block the client was
            offered has since emptied.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AttemptInProgressProblem' }

  # ── placement: kiểm tra đầu vào (SC-PLACEMENT) ────────────────────────────

  /placement/availability:
    get:
      tags: [placement]
      operationId: getPlacementAvailability
      summary: Can the placement test run, and what does it promise (TCCN-341-1, TCCN-341-4)
      description: |
        The entry screen asks this before offering anything. `available` is
        false when the bank holds no difficulty-tagged question, and the screen
        then says "Chưa bật được bài kiểm tra đầu vào." and offers another way
        to start studying (TCCN-341-4).

        A refusal, never a degraded test. Choosing questions with no difficulty
        on them would produce a level from what is effectively a random draw,
        and nothing on the screen would tell the learner the difference.

        `maxQuestions` and `estimatedMinutes` are shown before the learner
        commits (TCCN-341-1): someone who does not know how long a test runs
        either never starts it or abandons it halfway, and both yield no result.
      responses:
        '200':
          description: Whether the test can run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacementAvailability' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /placement/sessions:
    post:
      tags: [placement]
      operationId: startPlacement
      summary: Pick a level and start the test (YC-345 → YC-341)
      description: |
        Step 1 handing over to step 2. `selfAssessedLevel` is 1-6, or **null**
        for "Tôi chưa biết" — a first-class answer, not a missing one
        (TCCN-345-2), which starts the ladder at the bottom and switches the
        comparison off at step 3 (TCCN-342-9).

        The first question sits at the level just chosen (TCCN-341-7), and that
        level is a starting point only: it is neither a ceiling nor a floor
        (TCCN-341-8), and it gates no content anywhere (TCCN-345-3).

        Any session left in progress is abandoned here. That is TCCN-341-5: an
        unfinished placement test leaves no result and is never offered back —
        deliberately the opposite of R-03's resume, because a half-done
        practice attempt still measures work done while a half-done placement
        test has nothing to estimate from.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartPlacementRequest' }
      responses:
        '201':
          description: The session, with its first question.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacementRunner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: |
            `placement_unavailable` when the bank has no difficulty-tagged
            questions (TCCN-341-4), or `invalid_level` when the level is
            outside 1-6.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /placement/sessions/{sessionId}:
    get:
      tags: [placement]
      operationId: getPlacementSession
      summary: The question currently on screen
      description: |
        What a reload of the runner reads.

        This does not soften TCCN-341-5. That criterion's trigger is reopening
        the *entry* screen — "mở lại màn Kiểm tra đầu vào" — and starting from
        there still abandons whatever was running and deals a new test. What is
        refused is a half-finished test offered back as a choice, and a partial
        result; continuing a session the learner never left is neither.

        `question` is absent once the session is finished or abandoned, which
        sends the client to the result.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The session state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacementRunner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /placement/sessions/{sessionId}/answers:
    post:
      tags: [placement]
      operationId: answerPlacement
      summary: Answer the question on screen, get the next one (TCCN-341-2)
      description: |
        Correct means the next question is harder, wrong means easier, and
        every question served carries a difficulty assigned by hand under
        YC-303 — never a random pick.

        `question` is absent from the response once the ladder stops, which is
        the client's signal to go to the result. The ladder stops on the
        question count or once the answers have settled around one band; the
        learner never works through the whole bank (TCCN-341-3).

        One round trip per question, because which question comes next is not
        known until this one is answered. Nothing in the response reveals the
        difficulty (TCCN-303-2).
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlacementAnswerRequest' }
      responses:
        '200':
          description: The next question, or a finished session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacementRunner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `placement_finished` when the test has already ended, or
            `placement_question_moved` when the answer is for a question that
            is no longer on screen — almost always a double submit racing
            itself.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /placement/sessions/{sessionId}/result:
    get:
      tags: [placement]
      operationId: getPlacementResult
      summary: The four parts of the result (TCCN-342-1)
      description: |
        So với cấp độ đã chọn, cấp độ gợi ý, Nghe and Đọc separately, and the
        topics missed most.

        `suggestedLevel` is a level **to choose lessons with**. Điều cấm số 5
        allows this screen to name a level — it is what the feature is for —
        and forbids it reading as a verdict on ability or a prediction of the
        real exam (TCCN-342-2). It is deliberately not an `EstimatedBand`:
        that type means an estimated exam band off a complete paper, which is
        the claim this must not make. `note` carries the caveat and is
        required, so a client cannot render the level without it.

        `comparison` and `selfAssessedLevel` are both absent when the learner
        chose "Tôi chưa biết" — the section is gone rather than blank
        (TCCN-342-9).

        `listening` and `reading` are never averaged into one figure: the gap
        between them is itself the finding (TCCN-342-3).
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacementResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /placement/sessions/{sessionId}/recommendations:
    get:
      tags: [placement]
      operationId: getPlacementRecommendations
      summary: Đề xuất bài tập tương tự (YC-343)
      description: |
        Every item carries the numbers a reason is built from — `wrongCount`
        out of `encounters` on a named topic — because a recommendation with no
        reason is a list nobody trusts and nobody taps (TCCN-343-2).

        **No AI call, and no R-11 quota is charged** (TCCN-343-6). Everything
        here is a count over topics already attached to questions (R-06) and
        difficulties already assigned by hand (YC-303), so reopening the list
        costs nothing however many times it happens.

        R-32 names four sources. Two of them — video nhại theo (R-19) and tình
        huống hội thoại (R-21) — have no table anywhere in this system yet, and
        TCCN-343-1 is explicit that an empty source is dropped rather than
        padded. They will appear as those features land.

        Recommendations order content; they never lock it (TCCN-343-4).
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The recommendation list, possibly empty (TCCN-343-5).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacementRecommendations' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /placement/sessions/{sessionId}/questions/{questionId}/audio:
    get:
      tags: [placement]
      operationId: getPlacementAudio
      summary: The listening clip for a placement question
      description: |
        Plain authenticated bytes, fetched into a Blob by the client — none of
        the ticket machinery `/attempts` uses. Tickets exist to buy back the
        seconds a Blob costs while an exam clock runs, and to ration a listen
        to one under R-01. The placement test has neither a countdown nor a
        ration, so it would be paying that complexity for nothing.

        Cacheable for the same reason it is un-ticketed: `private, max-age=3600`
        with the asset's SHA-256 as a strong `ETag`. R-32 says nothing about
        limiting replays, and a warm-up that made a learner re-download the clip
        every time they listened again would be inventing a cost to pay.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: questionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: |
            The audio bytes, with `Accept-Ranges: bytes`, an `ETag`, and
            `Cache-Control: private, max-age=3600`.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        '302': { $ref: '#/components/responses/ClipRedirect' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /placement/sessions/{sessionId}/media/{assetId}:
    get:
      tags: [placement]
      operationId: getPlacementImage
      summary: Fetch a picture used by a passage or an answer choice
      description: |
        The asset must belong to a question this session actually served.

        Not rationed, unlike the listening clip: there is no per-view rule on
        images anywhere in the product, and a learner comparing four pictures
        will look at each of them more than once.

        These carry the question on the picture-choice items, where the four
        choices have no text at all — so a failure here is not cosmetic, it is
        a question that cannot be answered.

        Cacheable: `private, max-age=3600` with the asset's SHA-256 as a strong
        `ETag`.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: |
            The image bytes, with an `ETag` and
            `Cache-Control: private, max-age=3600`. Sent only when this
            deployment has no public bucket; otherwise see `302`.
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '302': { $ref: '#/components/responses/MediaRedirect' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The image is absent, is not an image, or belongs to no question in this session.

  /me/placement:
    get:
      tags: [placement]
      operationId: getMyPlacement
      summary: Current level and every past sitting (TCCN-344-1)
      description: |
        `history` is newest first, and both halves matter: the newest entry's
        `suggestedLevel` is the suggestion a retake replaces, and the older
        entries stay readable so the learner can see which skill moved and
        which did not.

        `currentLevel` is a different thing from the newest suggestion. It is
        "cấp độ đang dùng" — the level content is ordered by — and it changes
        only when the learner says so (TCCN-342-6), never downward on its own
        (TCCN-342-8). Absent until they have chosen one.
      responses:
        '200':
          description: The learner's placement state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyPlacement' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/level:
    put:
      tags: [placement]
      operationId: setMyLevel
      summary: Change the level content is ordered by (TCCN-342-6)
      description: |
        Only ever called from an explicit tap. The result screen offers the
        change and asks; nothing on the server applies it, and nothing lowers
        it because one twelve-question test came out under the learner's own
        guess (TCCN-342-8).

        The level orders content. It never gates it — every video and every
        question at every level stays open regardless (TCCN-345-3,
        TCCN-343-4).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetLevelRequest' }
      responses:
        '204': { description: The level was changed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ── writing ───────────────────────────────────────────────────────────────

  /attempts/{attemptId}/writing/{questionId}:
    get:
      tags: [writing]
      operationId: openWritingTask
      summary: Open a writing task (YC-201, YC-207)
      description: |
        Everything SC-WRITE-DO needs to start: any autosaved draft, the last
        submission if there is one, and the remaining grading allowance.

        The allowance is part of this response rather than a call the screen
        could forget to make. YC-207 is a sequencing requirement, not a display
        one — "hạn mức phải hiện trước khi người học ngồi viết, không phải sau
        khi đã viết xong 700 chữ".
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: The task, its draft, and the allowance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WritingTaskState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

    put:
      tags: [writing]
      operationId: saveWritingDraft
      summary: Autosave a draft (YC-201, R-03)
      description: |
        Last-write-wins by `clientSeq`, and the stored draft is returned rather
        than the submitted one. The client's outbox coalesces and retries, so a
        replayed older draft arriving after a newer one is routine; echoing the
        request back would leave the screen showing text the server discarded.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveWritingDraftRequest' }
      responses:
        '200':
          description: The draft as stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WritingDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /attempts/{attemptId}/writing/{questionId}/submission:
    post:
      tags: [writing]
      operationId: submitWriting
      summary: Submit a writing task for marking (YC-203, R-09, R-11)
      description: |
        The essay is stored before anything is dispatched or charged (R-09), so
        every path below keeps the learner's text in full.

        202 means it is queued for marking. 200 means there is already a result:
        either the same text was marked before, which costs nothing (R-11), or
        the month's allowance is spent and the essay is held as AWAITING_QUOTA
        with a balance saying when credits return (TCCN-207-2).

        422 is an empty submission — nothing is sent for marking and no credit
        is spent (TCCN-201-5). Writing under or over the required length is not
        an error: TCCN-201-4 warns and submits anyway.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Already marked, or held for want of credits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WritingSubmission' }
        '202':
          description: Queued for marking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WritingSubmission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /attempts/{attemptId}/writing/submissions:
    post:
      tags: [writing]
      operationId: submitAllWriting
      summary: Send every writing task for marking (YC-203)
      description: |
        What "Nộp phần Viết" does, and the only way the learner-facing app
        submits an essay. A per-task button meant tapping it mid-section threw
        the learner out of a paper they were halfway through; the real paper is
        collected once, when the section closes.

        Tasks are sent in the order printed on the paper, so when the month's
        allowance is shorter than the number of tasks, "send what fits" means
        câu 51 first. The remainder come back `AWAITING_QUOTA` with their text
        intact (TCCN-207-2), and a task with nothing written in it is skipped
        without touching a credit (TCCN-201-5).

        Must be called *before* the writing section is submitted: a task whose
        section has closed is refused with 409 (R-04).

        202 when something was queued, 200 when there was nothing to queue.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: Nothing to queue — every task blank, or every one held.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WritingBatchSubmitResult' }
        '202':
          description: Queued for marking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WritingBatchSubmitResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /attempts/{attemptId}/writing/grade:
    post:
      tags: [writing]
      operationId: gradeWritingNow
      summary: Start marking this attempt's queued essays (YC-203, TCCN-203-3)
      description: |
        Marking begins the moment the learner submits, on a host with no
        long-running process to run cmd/worker in. Without this the two
        drivers that exist — the worker loop and the scheduled drain — have
        nowhere to run, and an essay is stored, charged for, and never marked.

        TCCN-203-3 is unaffected: the learner is not made to wait. This marks
        only the caller's own submissions, only ones still QUEUED, and only as
        many as fit inside a deadline set below the host's maximum function
        duration — so it cannot outlive the request that made it. Anything it
        does not reach stays QUEUED for the worker or the drain, and the
        learner may close the tab at any point and lose nothing.

        Sent with `keepalive` right after `submitAllWriting`, and re-sent by
        the result screens while `remaining` is above zero.

        Repeatable and safe to call concurrently: the claim is a single
        conditional UPDATE, so two calls take different essays rather than the
        same one twice.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200':
          description: What this pass marked, and what is left.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WritingGradeRunResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /writing/submissions/{submissionId}:
    get:
      tags: [writing]
      operationId: getWritingSubmission
      summary: Read a submission and its mark (YC-203, YC-204)
      description: |
        SC-WRITE-RESULT polls this while `status` is QUEUED or GRADING, which is
        what TCCN-203-3 means by letting the learner leave the screen.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: The submission, with its mark when there is one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WritingSubmission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /writing/submissions/{submissionId}/retry:
    post:
      tags: [writing]
      operationId: retryWritingSubmission
      summary: Send a failed or held-back essay for marking again (TCCN-203-4)
      description: |
        Free: the failed run released its hold, so the retry takes a fresh one
        when marking actually starts (R-09). Retrying something already queued
        or already marked succeeds and changes nothing.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '202':
          description: Queued, or already in a state that needs no retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WritingSubmission' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/writing/quota:
    get:
      tags: [writing]
      operationId: getWritingQuota
      summary: Remaining grading allowance (YC-207, R-11)
      responses:
        '200':
          description: What is left this month, and when it resets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WritingQuota' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── nhại theo (SC-SHADOW-LIST, SC-SHADOWING) ──────────────────────────────
  #
  # R-19. Watch a short dialogue, replay one line at a time, read along after
  # it. There is no microphone anywhere in this block and there must not be:
  # the record / listen back / compare loop is SC-SPEAKING and it is ver1.2
  # (TCCN-352-8). "Practised" below means a line was played to its end, not
  # that anything about it was measured.

  /shadowing/videos:
    get:
      tags: [shadowing]
      operationId: listShadowVideos
      summary: Ngữ liệu nhại theo (R-19)
      description: |
        Published videos **that have at least one line**. A video with no
        segmented transcript is not in this list and is not greyed out either
        (TCCN-351-1): there is no unit to repeat, so there is nothing to
        practise.

        The filter is the server's and belongs there. Filtering on the client
        means the count on the chip is computed from rows the interface throws
        away, and "Video 8" over seven rows is a number nobody can trust.

        Ordered by distance from the learner's own level, never filtered by it
        — a level orders content and does not gate it (TCCN-345-3).
      parameters:
        - name: limit
          in: query
          description: Clamped rather than refused, as everywhere else here.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: topicId
          in: query
          description: |
            Arrives from a placement recommendation. Unlike level this really
            does filter — the learner asked for this topic.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Newest first within a level band. `[]` when empty (R-13).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShadowVideoList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /shadowing/videos/{videoId}:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    get:
      tags: [shadowing]
      operationId: getShadowVideo
      summary: Everything SC-SHADOWING renders
      description: |
        Lines, glossary and term anchors arrive together rather than behind
        three requests. The screen cannot render without the lines — a
        shadowing player with an empty transcript is a video player — and a
        second round trip on a phone is a blank pane the learner watches while
        the first line plays past them. Twenty-eight lines of Korean, their
        Vietnamese and a few dozen anchors is a few kilobytes.

        A draft video 404s here exactly as a nonexistent one does.

        The 0.5 / 1 / 1.5 / 2 speed control has no server surface at all: it is
        `playbackRate` over `playbackUrl`, which is a public CDN URL precisely
        so that seeking and rate changes are native.
      responses:
        '200':
          description: The video, its lines, and its own dictionary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShadowVideoDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shadowing/videos/{videoId}/lines/{lineId}/practised:
    parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/LineId'
    put:
      tags: [shadowing]
      operationId: markShadowLinePractised
      summary: Ghi nhận đã nghe hết một câu (TCCN-352-5)
      description: |
        PUT with no body, and idempotent: the write is ON CONFLICT DO NOTHING,
        so a replay costs nothing. The client fires this on every line that
        reaches its end, including one the learner repeats five times, and a
        POST would promise creation semantics the handler does not have.

        A line belonging to another video is a 404 — not because it does not
        exist, but because it does not exist *here*.
      responses:
        '200':
          description: The whole progress object, so the client patches its cache rather than refetching.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShadowProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/shadowing/cards:
    get:
      tags: [shadowing]
      operationId: listShadowCards
      summary: Bộ thẻ của tôi, phần nhại theo được
      description: |
        The second tab of SC-SHADOW-LIST. Only the learner's own cards that
        came from a shadowing line, because R-15 makes a card shadowable when
        it came from "câu nghe ... có ngữ liệu tiếng" — a sentence you can
        hear. A card made from a reading question has no audio and no example
        sentence, so it is absent rather than disabled (TCCN-351-6).

        Expect `[]` for a while: nothing creates these until a learner saves a
        word from a video's dictionary. That is an honest empty state with
        designed copy behind it, not a placeholder.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Newest first. `[]` when empty (R-13).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShadowCardList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── chép chính tả (SC-DICTATION) ──────────────────────────────────────────
  #
  # R-36. Nghe một câu, gõ lại đúng những gì nghe được.
  #
  # THE ONE RULE THAT SHAPES EVERY SCHEMA BELOW: the Korean does not travel
  # until the answer has been submitted. TCCN-421-1 says "màn hình không hiện
  # lời thoại của câu đó ở bất cứ đâu", and a payload is where "ở bất cứ đâu"
  # is decided — a component that never renders textKo is one refactor away
  # from rendering it; a response that never carries it cannot be.

  /dictation/sets:
    get:
      tags: [dictation]
      operationId: listDictationSets
      summary: Bộ chép chính tả (R-36)
      description: |
        Published sets that have at least one sentence.

        Ordered by distance from the learner's own level, never filtered by it
        — a level orders content and does not gate it (TCCN-345-3).

        `correctCount` counts sentences whose BEST result was đúng or gần
        đúng. A gần đúng counts because the learner heard every character
        (TCCN-427-1); a skipped sentence has no result and cannot count.
      parameters:
        - name: limit
          in: query
          description: Clamped rather than refused, as everywhere else here.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: '`[]` when empty (R-13).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictationSetList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /dictation/sets/{setId}:
    parameters:
      - $ref: '#/components/parameters/SetId'
    get:
      tags: [dictation]
      operationId: getDictationSet
      summary: Everything SC-DICTATION renders before anyone types
      description: |
        Sentences, their audio, and how the learner has done on each.

        **No Korean, no translation, no dictionary.** Showing the sentence is
        the exercise gone (TCCN-421-1), and a translation is worse — the
        learner reads backwards from the meaning to the spelling and never
        listens (TCCN-421-6). The transcript arrives from the attempt
        endpoint and nowhere else.

        A DRAFT set answers 404, exactly as a nonexistent one does.
      responses:
        '200':
          description: Sentences in order, with the resume point.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictationSetDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dictation/sets/{setId}/items/{itemId}/attempt:
    parameters:
      - $ref: '#/components/parameters/SetId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [dictation]
      operationId: submitDictationAttempt
      summary: Chấm một câu đã gõ (YC-423, YC-424)
      description: |
        Graded by comparing strings, never by calling a model: the result is
        deterministic and spends no R-11 credit (TCCN-423-4).

        Three levels, not two. Đúng · **gần đúng** · chưa đúng, where gần đúng
        is "only the spacing differs" — Korean 띄어쓰기 is a rule native
        speakers get wrong too, and marking it red teaches a learner their
        listening is bad when their orthography slipped (TCCN-423-2).

        The response is the only place the Korean crosses the wire, and it
        carries both strings marked character by character so the screen can
        put them side by side (TCCN-424-1).

        An empty submission is **422 with nothing recorded** (TCCN-424-3): a
        blank box is a prompt, not a wrong answer.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictationAttemptRequest' }
      responses:
        '200':
          description: The grade, the transcript, and where the two differ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictationAttemptResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /dictation/sets/{setId}/items/{itemId}/skip:
    parameters:
      - $ref: '#/components/parameters/SetId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [dictation]
      operationId: skipDictationItem
      summary: Bỏ qua một câu (TCCN-425-1)
      description: |
        Moves to the next sentence and **records nothing**. Câu 7 is marked
        chưa làm, not sai, and the learner may come back to it whenever they
        like.

        Writing no result is the whole implementation of that: a skipped
        sentence has no row, so it can neither be counted wrong nor counted
        done.
      responses:
        '200':
          description: Progress, and the sentence the learner lands on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictationSkipResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── studio: chép chính tả ─────────────────────────────────────────────────
  #
  # Internal, gated by dictation:* permissions held only by content roles.
  #
  # There is no write route for the CONTENT here. Sentences, translations, the
  # dictionary and its anchors all arrive through cmd/dictation-import — the
  # same sequencing cmd/importer was built on — so the only thing this surface
  # changes is the verdict, which is the only thing it exists for.
  #
  # Why that verdict cannot be skipped: grading is exact comparison against
  # textKo, so a sentence whose audio and transcript disagree marks a learner
  # wrong for hearing correctly, and they cannot tell that from their own
  # mistake.

  # ── wordbook (R-33 · SC-EXAM-WORDBOOK) ────────────────────────────────────

  /exams/{examId}/wordbook:
    parameters:
      - $ref: '#/components/parameters/ExamId'
    get:
      tags: [wordbook]
      operationId: getExamWordbook
      summary: One paper's bảng từ vựng, both lists
      description: |
        Every entry of both lists in one response, with the caller's own card
        state for each.

        **Not paginated, deliberately.** YC-504 and YC-507 require every filter
        chip to show the number of entries matching it — "Chưa lưu 164", "Hay
        gặp 26" — and a page cannot produce an honest one. A paper's wordbook
        is a few hundred entries; the client narrows what it already holds.

        Only entries with all six things appear (R-33: "thiếu một thứ thì mục
        đó chưa hiện ra được"). An incomplete entry is absent, not dimmed and
        not locked.

        A paper with no wordbook answers 404, and so does one whose entries are
        all incomplete. That is TCCN-501-5 — "Đề này chưa có bảng từ vựng." is
        a designed state with its own copy, and an empty array would be
        indistinguishable from a filter that matched nothing.
      responses:
        '200':
          description: Both lists, in Từ vựng then Ngữ pháp order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wordbook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /exams/{examId}/wordbook/entries/{entryId}/questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/ExamId'
      - $ref: '#/components/parameters/EntryId'
      - $ref: '#/components/parameters/QuestionId'
    get:
      tags: [wordbook]
      operationId: getWordbookSourceSentence
      summary: The original sentence behind "câu 14"
      description: |
        TCCN-501-3: touching a position opens the question it names and shows
        the sentence verbatim.

        **No choices, no answer key, no explanation.** YC-506 lets a learner
        open a wordbook from SC-TEST-LIST without having sat the paper — and
        they may still sit it — so this must not become a way to read the
        answers. `internal/api/contract/leak_test.go` is where that stays true.
      responses:
        '200':
          description: The stem, the passage it is read with, and where the headword sits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WordbookSourceSentence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wordbook/entries/{entryId}/audio:
    parameters:
      - $ref: '#/components/parameters/EntryId'
    get:
      tags: [wordbook]
      operationId: getWordbookAudio
      summary: A pronunciation clip, on a deployment with no public bucket
      description: |
        The fallback behind `Wordbook.items[].audioUrl`. Where a public bucket
        is configured that field is a CDN address and this route is never
        called; without one it is a path to here.

        It rations nothing — R-33 gives a learner unlimited replays — so unlike
        the exam-audio ticket route the only thing it enforces is that the
        caller is signed in.
      responses:
        '200':
          description: The clip.
          content:
            audio/*:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── assistant (R-37 · SC-CHATBOT) ─────────────────────────────────────────
  #
  # Three routes and no fourth for the allowance. TCCN-563-1 is about ordering
  # rather than display — the number has to be on screen before the learner
  # types anything — so it rides on the opening payload instead of a call the
  # panel would have to make separately.
  #
  # There is deliberately no route here that accepts audio. TCCN-568-3: the
  # product removed every recording surface and therefore carries no
  # biometric-data obligation, and R-37 is blunt that one voice button on a
  # side feature would drag all of it back.

  /me/assistant:
    get:
      tags: [assistant]
      operationId: getAssistantPanel
      summary: Everything the trợ lý panel needs to open (YC-561, YC-563, R-11)
      description: |
        One request, because two would leave a frame in which the panel is open
        and knows neither the allowance nor what to suggest — which is the empty
        chat box `TCCN-562-6` forbids.

        The anchor parameters describe what the learner has on screen. They
        change the suggestions and the context an answer is built from; none of
        them is required, and a panel opened with none of them still works.
      parameters:
        - name: screen
          in: query
          schema:
            type: string
            enum: [EXAM_WORDBOOK, REVIEW, TEST_RESULT, WEAKNESS, DECK]
        - name: examId
          in: query
          schema: { type: string, format: uuid }
        - name: entryId
          in: query
          schema: { type: string, format: uuid }
        - name: attemptId
          in: query
          schema: { type: string, format: uuid }
        - name: questionId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The allowance, the suggestions, and this learner's history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantPanel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/assistant/questions:
    post:
      tags: [assistant]
      operationId: askAssistant
      summary: Ask one question (YC-562, YC-564, YC-566, YC-567)
      description: |
        Returns `200` for every outcome that produced a turn, including the two
        where no answer was written — `NO_QUOTA` and `FAILED`. Both are things
        that happened and are now stored, and each renders as its own line in
        the thread with its own next step. `TCCN-562-5` asks for a retry button
        beside the failure and for the typed question to stay in the box, and a
        problem response gives the client the error but no turn to attach either
        to.

        Whether the turn cost a lượt is on `turn.charged`, and the balance after
        it is on `quota`. `OFF_TOPIC` and `FAILED` never charge (`TCCN-567-1`),
        and neither does an answer served from an earlier identical question
        (`TCCN-564-1`, flagged as `turn.fromSaved`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantAskRequest' }
      responses:
        '200':
          description: The turn, and the allowance after it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantAskResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            The anchor names an attempt that is still in progress. `TCCN-566-1`
            and `YC-565`: the launcher is not drawn during a paper, so this is
            unreachable from the app.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            This deployment has no AI provider configured, so there is nothing
            to answer with. Nothing is broken — `AssistantPanel.available` is
            `false` and the client draws no launcher, so a request arriving here
            is a stale client or a direct API call.

            Unlike other 5xx responses in this API, `detail` is populated: a
            503 is only ever constructed deliberately, and on a
            missing-configuration path the reason is the useful part.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/assistant/questions/stream:
    post:
      tags: [assistant]
      operationId: askAssistantStream
      summary: Ask one question, streamed (YC-562)
      description: |
        The same turn as `askAssistant`, delivered as Server-Sent Events. Same
        request body, same charging rules, same stored row — what differs is
        when the bytes arrive, not what they are.

        **The generated client for this operation is not usable.** SSE is not a
        JSON body, and codegen types this response as a string. The web client
        reads it by hand with `fetch` and a `ReadableStream`. The payload
        schemas below *are* generated and are what that hand-written parser
        should type itself against.

        Event grammar, in order:

        | event | payload | meaning |
        |---|---|---|
        | `ready` | `AssistantStreamReady` | Exactly once, first. The hold is taken and a model call is starting. |
        | `delta` | `AssistantStreamDelta` | Zero or more. Each carries whole sentences, never a partial one. |
        | `retract` | `AssistantStreamRetract` | At most one. Discard everything accumulated. Nothing follows but the terminal event. |
        | `done` | `AssistantAskResult` | Terminal. |
        | `error` | `Problem` | Terminal. Only for a failure *after* the stream opened. |
        | `: …` | — | Comment or heartbeat. No meaning. |

        `done` is authoritative: replace whatever was accumulated with
        `done.turn.answer.text`. Deltas are shown early on the strength of a
        guard that runs per sentence; `done` is what ran the guard over the
        whole answer, pruned the links against real ids, and settled the credit.
        Its payload is byte-identical to `askAssistant`'s `200`, which is what
        lets one client render both paths.

        Errors that happen before the first event — an empty question, a paper
        in progress, no AI provider configured — are ordinary `problem+json`
        with their real status, exactly as on `askAssistant`. Nothing is written
        until there is something to say, so the status line is still available.

        A `retract` means the answer was withdrawn mid-flight: `SCORE_PREDICTION`
        is `TCCN-566-3` catching a verdict about a real exam, `TRUNCATED` is a
        turn that ran out of budget or lost its provider with text already on
        screen. A truncated turn is `FAILED` and costs nothing.

        There is no resumption. `Last-Event-ID` is ignored and no `id:` is sent:
        a turn holds a credit while it runs, so a resumable one would be
        offering something that cannot work. That is also why `EventSource` is
        unusable here — it cannot POST and cannot carry `Authorization`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantAskRequest' }
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  A Server-Sent Events stream. See the operation description for
                  the event grammar and payload types.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            The anchor names an attempt that is still in progress, as on
            `askAssistant`. Raised before the stream opens, so it is a real
            status code.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: |
            This deployment has no AI provider configured, as on `askAssistant`.
            Raised before the stream opens.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/assistant/turns:
    delete:
      tags: [assistant]
      operationId: deleteAssistantHistory
      summary: Xoá toàn bộ lịch sử hỏi đáp (YC-568)
      description: |
        A real delete, not a retraction flag — `TCCN-568-2` says "xoá thật", and
        R-37 files it beside "không dùng nội dung hỏi đáp vào việc gì khác".
        The confirmation the criterion asks for happens in the client before
        this is called.

        The spent allowance does not come back, and `quota` is returned so the
        panel can redraw the same figure it had: "xoá lịch sử không phải cách
        lấy thêm lượt".
      responses:
        '200':
          description: How many turns went, and the untouched allowance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantDeleteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/dictation/sets:
    get:
      tags: [studio]
      operationId: listAdminDictationSets
      summary: Every dictation set, drafts included
      description: 'rbac: `dictation:read:any`.'
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, IN_REVIEW, PUBLISHED, RETIRED] }
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDictationSetList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/dictation/sets/{setId}:
    parameters:
      - $ref: '#/components/parameters/SetId'
    get:
      tags: [studio]
      operationId: getAdminDictationSet
      summary: One set, with every sentence and where its review stands
      description: |
        `rbac: dictation:read:any`. Carries `textKo` — a reviewer cannot pass a
        sentence they cannot read, which is exactly why these schemas are
        separate from the learner's and why the learner's are guarded by
        internal/api/contract/leak_test.go.
      responses:
        '200':
          description: Sentences in order, with audio and approval state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDictationSetDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [studio]
      operationId: saveAdminDictationSet
      summary: Sửa thông tin bộ
      description: |
        `rbac: dictation:write` — the permission migration 00023 seeded and no
        route has held until now.

        The metadata only: title, level, voice. Sentences, translations and the
        dictionary still arrive through `cmd/dictation-import` and cannot be
        edited here, which is the division the studio screen is built on. What
        this fixes is the class of mistake the importer cannot: a title typed
        wrong in the manifest, a set filed under the wrong TOPIK band, a voice
        label nobody filled in.

        No verdict is touched. Nothing here changes what a reviewer heard, so
        nothing here sends them back to hear it again — unlike an edit to a
        sentence, which bumps its revision and does exactly that.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveDictationSetRequest' }
      responses:
        '200':
          description: The set, as saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDictationSetDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [studio]
      operationId: deleteAdminDictationSet
      summary: Xoá hẳn một bộ chưa từng xuất bản
      description: |
        `rbac: dictation:write`. A hard delete, and deliberately narrow: it
        refuses with **409** on any set that has ever been published, whatever
        its status is now.

        `published_at IS NULL` is the test, not `status <> 'PUBLISHED'`. A set
        that went out and was later retired still has learners' results hanging
        off it and cards naming its sentences as their source, and the row is
        the only thing that can still say where those came from. Retiring is
        what removes such a set from the learner's world; this is for the other
        kind — an import that went wrong, a set made to test the importer,
        content no learner has ever been able to reach.

        Because a set only becomes reachable by publishing, that same test is
        what makes the cascade safe: with no `published_at` there are no
        results, no bookmarks and no cards to lose.

        The rows in `assets` are left where they are, and so are the objects on
        the edge. Audio is content-addressed and outlives any one row pointing
        at it; reclaiming it is a sweep that knows every reference, not a side
        effect of one delete.
      responses:
        '204':
          description: Gone, with its sentences and its dictionary.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/dictation/sets/{setId}/items/{itemId}/approval:
    parameters:
      - $ref: '#/components/parameters/SetId'
      - $ref: '#/components/parameters/ItemId'
    put:
      tags: [studio]
      operationId: setAdminDictationApproval
      summary: Nghe duyệt một câu
      description: |
        `rbac: dictation:approve`. REJECTED requires a reason — a sentence
        turned down with no reason is one nobody can fix.

        The verdict is always stamped against the sentence's CURRENT revision.
        Editing the Korean or replacing the audio afterwards makes it stale, and
        a stale verdict counts as unreviewed everywhere: in the counter, and at
        the publish gate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminDictationApprovalRequest' }
      responses:
        '200':
          description: The sentence, with its new verdict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDictationItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/dictation/sets/{setId}/publish:
    parameters:
      - $ref: '#/components/parameters/SetId'
    post:
      tags: [studio]
      operationId: publishAdminDictationSet
      summary: Đưa bộ vào ngân hàng
      description: |
        `rbac: dictation:publish`. Blockers refuse; warnings do not, but must be
        accepted explicitly — a warning nobody has to acknowledge is a warning
        nobody reads.

        **200 whatever the report says.** A report carrying blockers is an
        answer, not an error: the screen renders the list and the reviewer works
        through it, which a 4xx would turn into a banner with the detail buried.
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
        - name: acceptWarnings
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: What blocks, what merely warns, and whether it went out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDictationPublishReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/dictation/sets/{setId}/retire:
    parameters:
      - $ref: '#/components/parameters/SetId'
    post:
      tags: [studio]
      operationId: retireAdminDictationSet
      summary: Gỡ bộ khỏi ngân hàng
      description: |
        `rbac: dictation:publish` — the inverse of publish, held by whoever may
        publish, because deciding a set should stop reaching learners is the
        same decision as deciding it should reach them.

        Sets `status` to `RETIRED`. Every learner-facing query filters on
        `status = 'PUBLISHED'`, so the set leaves the list, the player and the
        card suggestions at once — while results, bookmarks and the cards
        naming its sentences all stay exactly where they are. That is the whole
        difference from delete, and it is why a published set cannot be deleted.

        Reversible: publishing again runs the gate and puts it back, so a set
        pulled over one bad sentence goes out again once the sentence is fixed.

        **409 on a set that was never published.** There is nothing to undo, and
        the answer for a draft no learner has seen is delete rather than retire.
      responses:
        '200':
          description: The set, now retired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDictationSetDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ── admin: ngân hàng đề (SC-BANK-ADMIN) ───────────────────────────────────
  #
  # Internal. Every operation here is gated by an rbac permission held only by
  # content_editor / content_admin, and none of it is reachable by a learner.
  # The screens live in kolearn-dashboard.

  /admin/exams:
    get:
      tags: [admin]
      operationId: listAdminExams
      summary: Every exam in the bank, drafts included
      description: |
        rbac: `exam:read`. Unlike the learner's `GET /exams` this returns DRAFT
        and RETIRED papers and carries no per-caller attempt columns — the
        drafts are the work, and whose attempts they are is not the question
        this screen asks.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ExamStatus' }
        - name: level
          in: query
          schema: { $ref: '#/components/schemas/ExamLevel' }
      responses:
        '200':
          description: The bank.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminExamListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/exams/{examId}:
    parameters:
      - $ref: '#/components/parameters/ExamId'
    get:
      tags: [admin]
      operationId: getAdminExam
      summary: One paper, with its sections and the blueprint it was cut from
      description: 'rbac: `exam:read`.'
      responses:
        '200':
          description: The paper.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminExamDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/exams/{examId}/questions:
    parameters:
      - $ref: '#/components/parameters/ExamId'
    get:
      tags: [admin]
      operationId: listAdminQuestions
      summary: The paper's questions, with how much of each is authored
      description: 'rbac: `exam:read`.'
      responses:
        '200':
          description: The questions, in paper order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminQuestionRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/exams/{examId}/publish:
    parameters:
      - $ref: '#/components/parameters/ExamId'
    post:
      tags: [admin]
      operationId: publishAdminExam
      summary: Run the release gate, and publish when it passes
      description: |
        rbac: `exam:publish`. Reports what `bank.Publish` reports, including the
        split it already makes: **blockers** refuse the publish, **warnings** do
        not. Merging the two would destroy the reason both exist — if warnings
        blocked as well, nobody would publish anything and the gate would be
        routed around (TCCN-301-7).

        `dryRun` runs the gate and reports without releasing, which is how the
        screen shows both groups before anyone commits to anything. A 200 with
        a non-empty `blockers` means the gate ran and refused; that is the
        answer, not an error, so it is not problem+json.
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
        - name: acceptWarnings
          in: query
          description: |
            Required when the report carries warnings and nothing blocks. The
            confirmation step exists because a warning nobody has to
            acknowledge is a warning nobody reads.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The gate ran. Read `published` for what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/questions/{questionId}:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    get:
      tags: [admin]
      operationId: getAdminQuestion
      summary: Everything the author edits, in one payload
      description: 'rbac: `exam:read`.'
      responses:
        '200':
          description: The question.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin]
      operationId: saveAdminQuestion
      summary: Save the draft
      description: |
        rbac: `question:write`. A half-built question saves — three choices, two
        correct answers, no explanation at all (TCCN-301-10). Requiring a
        complete question at first save only teaches an author to type filler
        to get past it, and the filler stays; the publish gate is where the
        shape is enforced.

        The one refusal is the answer key of a question learners have already
        sat, which is refused by a trigger in migration 00016 whatever this
        handler believes (TCCN-301-8).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveQuestionRequest' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `question_answer_locked` — the answer key cannot change on a
            question that has been sat.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/AnswerLockedProblem' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/questions/{questionId}/versions:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    post:
      tags: [admin]
      operationId: createQuestionVersion
      summary: Supersede a question rather than rewrite it
      description: |
        rbac: `question:write`. The sanctioned way past a 409: the old question
        keeps its answer key and every attempt that referenced it, and the new
        one carries the correction forward (TCCN-301-8).
      responses:
        '201':
          description: The new version, in the same exam and section.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/passages/{passageId}:
    parameters:
      - name: passageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      operationId: getAdminPassage
      summary: The stimulus a layer-4 span is measured against
      description: |
        rbac: `exam:read`. The author selects inside this text to produce the
        character range, so the offsets stored are offsets into exactly what is
        returned here.
      responses:
        '200':
          description: The passage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPassage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/blueprints:
    get:
      tags: [admin]
      operationId: listBlueprints
      summary: R-16's exam structure, as configuration
      description: |
        rbac: `exam:read`. Section counts, time limits, scores and sitting
        numbers come from `exam_blueprints`, which is versioned. GĐ-1 warns the
        TOPIK format changes between years and must be checked against the
        official publication, so a format change is a new version rather than
        an edit — and never a constant in a screen (TCCN-302-1).

        Read-only over HTTP by design: `kolearn_app` has no INSERT, UPDATE or
        DELETE on this table (migration 00012). Exam structure changes through
        a migration a person reviewed.
      responses:
        '200':
          description: Every blueprint version.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Blueprint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/imports/dry-run:
    post:
      tags: [admin]
      operationId: dryRunImport
      summary: Report what a bundle would do, and write nothing
      description: |
        rbac: `import:manage`. Runs the same validation gate as the real import
        and touches no row (TCCN-301-6). Every problem is reported at once
        rather than stopping at the first: fixing a thousand-question file one
        error per run is not a workflow anyone follows — people hand-edit the
        database instead, and the paper lands in the bank without ever passing
        the gate.

        Bundles posted here carry no audio or images. A paper with media still
        goes through `cmd/importer -assets`, which is the only path that can
        upload the files.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200':
          description: What would happen, or why it cannot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/imports:
    post:
      tags: [admin]
      operationId: runImport
      summary: Apply a bundle to the bank
      description: |
        rbac: `import:manage`. Imports as a DRAFT; publishing is a separate,
        gated step. An exam whose code already exists is refused rather than
        merged — a re-import is a new version of a paper, not an edit to one
        people may already have sat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ── xưởng video (SC-VIDEO-STUDIO) ─────────────────────────────────────────
  #
  # Internal, and gated by shadowing:* permissions held only by
  # content_editor / content_admin. The screens live in kolearn-dashboard.
  #
  # Bytes never pass through this API. There are two 4.5 MB request-body gates
  # between a browser and this handler — Vercel's Go function and the
  # dashboard's own proxy, which buffers the whole body — and a three-minute
  # video is around 30 MB. Uploads go straight to Cloudflare R2 through a
  # presigned PUT; see upload-target below.

  /admin/shadowing/videos:
    get:
      tags: [studio]
      operationId: listAdminShadowVideos
      summary: Every shadowing video, drafts included
      description: 'rbac: `shadowing:read:any`.'
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ShadowVideoStatus' }
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminShadowVideoList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [studio]
      operationId: createAdminShadowVideo
      summary: Start a draft
      description: |
        rbac: `shadowing:write`. A draft exists before its video does, because
        the upload needs something to hang an object key off — and because the
        list screen's empty state has to offer a way forward that leads
        somewhere.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShadowVideoRequest' }
      responses:
        '201':
          description: The new draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminShadowVideoDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/shadowing/videos/{videoId}:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    get:
      tags: [studio]
      operationId: getAdminShadowVideo
      summary: The whole studio payload
      description: 'rbac: `shadowing:read:any`. Metadata, asset, lines, approvals, glossary, anchors.'
      responses:
        '200':
          description: The video as the studio edits it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminShadowVideoDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [studio]
      operationId: saveAdminShadowVideo
      summary: Save the metadata
      description: |
        rbac: `shadowing:write`. Permissive: a half-built video saves
        (TCCN-354-5). Requiring completeness at the first save only teaches an
        author to type filler to get past it, and the filler stays. The
        completeness rules live at the publish gate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveShadowVideoRequest' }
      responses:
        '200':
          description: The saved video.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminShadowVideoDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [studio]
      operationId: deleteAdminShadowVideo
      summary: Xoá hẳn một video chưa từng xuất bản
      description: |
        rbac: `shadowing:write`. A hard delete, refused with **409** on any
        video that has ever been published, whatever its status is now.

        `published_at IS NULL` is the test rather than `status <> 'PUBLISHED'`:
        a video that went out and was later retired still has tiến độ rows
        against its lines and cards naming those lines as their source, and the
        row is the only thing left that can say where they came from.

        A video only becomes reachable by publishing, so that same test is what
        makes the cascade safe — with no `published_at` there is no progress and
        no card to lose. Lines, dictionary and anchors go with it.

        The `assets` row and the object in the bucket are left alone. Thirty
        megabytes are worth reclaiming, but by a sweep that knows every
        reference, not by a delete that assumes it was the only one.
      responses:
        '204':
          description: Gone, with its lines and its dictionary.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/shadowing/videos/{videoId}/upload-target:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    post:
      tags: [studio]
      operationId: createShadowUploadTarget
      summary: A presigned R2 PUT for one object
      description: |
        rbac: `asset:write`. The server chooses the object key, signs a PUT for
        it, and hands back the URL and the headers that were signed. R2's
        account credentials never reach the browser.

        `headers` is opaque to the client: it echoes what was signed, and the
        browser must send those headers **exactly**, because a header that was
        signed and then altered is a signature mismatch. Keeping them opaque is
        also what stops the dashboard learning any R2 header names.

        The presign binds the key, the content type, the byte size and a short
        expiry, so everything the browser could otherwise change is fixed here
        rather than trusted later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShadowUploadTargetRequest' }
      responses:
        '200':
          description: Where to put the bytes, and with what.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShadowUploadTarget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/shadowing/videos/{videoId}/uploaded:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    post:
      tags: [studio]
      operationId: confirmShadowUpload
      summary: The bytes landed — check them and attach
      description: |
        rbac: `asset:write`. The client says the PUT succeeded; the server
        verifies rather than believes. It HEADs the object, records the size and
        digest **R2 reports**, writes the assets row, and points the video at
        it.

        Attaching a video resets every line's approval and bumps every line's
        revision. An approval is a statement about one stretch of audio, and
        that audio has just been replaced (TCCN-354-4).

        Idempotent on the object key, so retrying after a timeout re-sends no
        bytes — which is the whole reason this is a separate call from the PUT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmShadowUploadRequest' }
      responses:
        '200':
          description: The video with its asset attached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminShadowVideoDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/shadowing/videos/{videoId}/lines:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    put:
      tags: [studio]
      operationId: saveAdminShadowLines
      summary: Replace the transcript
      description: |
        rbac: `shadowing:write`. The whole list in one transaction, matching how
        SaveQuestionRequest handles choices — and here it is the only shape that
        works at all, because a line and its dictionary anchors have to be
        rewritten together inside one deferred-constraint window.

        Lines are renumbered from the array order. Overlapping spans are
        refused (TCCN-354-6); gaps between lines are normal and are not.

        Editing a line's timing or Korean bumps its revision, which retires any
        approval standing against it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveShadowLinesRequest' }
      responses:
        '200':
          description: The video, with its lines as saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminShadowVideoDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/shadowing/videos/{videoId}/lines/{lineId}/approval:
    parameters:
      - $ref: '#/components/parameters/VideoId'
      - $ref: '#/components/parameters/LineId'
    put:
      tags: [studio]
      operationId: setShadowLineApproval
      summary: Người bản ngữ nghe duyệt một câu
      description: |
        rbac: `shadowing:approve`. REJECTED requires a reason (TCCN-354-2) — a
        line turned down with no reason is a line nobody can fix.

        The verdict is recorded against the line's current revision, so a later
        edit retires it automatically rather than leaving a stale approval that
        reads as current.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetShadowLineApprovalRequest' }
      responses:
        '200':
          description: The line, with its verdict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminShadowLine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/shadowing/videos/{videoId}/glossary:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    put:
      tags: [studio]
      operationId: saveAdminShadowGlossary
      summary: Replace this video's dictionary
      description: |
        rbac: `shadowing:write`. Entries and their anchors together, for the
        same transactional reason the lines endpoint takes the whole list.

        422 when an entry is settled while its context meaning still equals its
        general meaning (TCCN-354-3), compared after normalisation so trailing
        space and case cannot slip past. Drafting these with a model copies the
        general gloss across more often than not, and a learner who reads the
        same two lines twice concludes the second carries no information —
        which is true, and which is the whole feature gone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveShadowGlossaryRequest' }
      responses:
        '200':
          description: The video, with its dictionary as saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminShadowVideoDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/shadowing/videos/{videoId}/publish:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    post:
      tags: [studio]
      operationId: publishAdminShadowVideo
      summary: Run the gate, and publish when it passes
      description: |
        rbac: `shadowing:publish`. Same shape as publishAdminExam, and for the
        same reasons: **blockers** refuse the publish, **warnings** do not, and
        merging the two would destroy why both exist — if warnings blocked as
        well, nobody would publish anything and the gate would be routed around.

        Every blocker names the line it is about (TCCN-354-7). "3 câu hỏng"
        sends a native speaker back through twenty-eight lines to find which
        three.

        `dryRun` runs the gate and reports without releasing, which is how the
        screen shows both groups before anyone commits. A 200 carrying blockers
        means the gate ran and refused; that is the answer, not an error, so it
        is not problem+json.
      parameters:
        - name: dryRun
          in: query
          schema: { type: boolean, default: false }
        - name: acceptWarnings
          in: query
          description: Required when warnings stand and nothing blocks. A warning nobody has to acknowledge is a warning nobody reads.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The gate ran. Read `published` for what happened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShadowPublishReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/shadowing/videos/{videoId}/retire:
    parameters:
      - $ref: '#/components/parameters/VideoId'
    post:
      tags: [studio]
      operationId: retireAdminShadowVideo
      summary: Gỡ video khỏi ngân hàng
      description: |
        rbac: `shadowing:publish` — the inverse of publish, and the same
        decision, so the same permission.

        Sets `status` to `RETIRED`. Every learner-facing query filters on
        `status = 'PUBLISHED'`, so the video leaves the list and the player at
        once, while tiến độ and the cards made from its lines stay. That is
        the whole difference from delete, and why a published video cannot be
        deleted.

        Reversible: publishing again runs the gate and puts it back.

        **409 on a video that was never published**, where the answer is delete
        rather than retire.
      responses:
        '200':
          description: The video, now retired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminShadowVideoDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ExamId:
      name: examId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SetId:
      name: setId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VideoId:
      name: videoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LineId:
      name: lineId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ClipRedirect:
      description: |
        `Location` is a signed, time-bounded address for the clip, which the
        player fetches directly from object storage. The bytes never pass
        through this API, and `Range` works against it natively.

        This is the same class of capability the ticket URL already is — an
        unauthenticated address with an expiry, issued only after the rule has
        been applied — with storage rather than this function carrying the
        megabytes. It is minted **after** the ticket is checked, never instead
        of checking it, and never before.

        For a rationed clip the address expires with the ticket and both this
        response and the object itself say `no-store`. For anything unrationed
        the address is stable for a day so the browser can reuse it.

        Sent only where the deployment can sign addresses. Otherwise the same
        route answers `200` with the bytes.
      headers:
        Location:
          description: The signed address of the clip.
          schema: { type: string, format: uri }
        Cache-Control:
          description: '`no-store` for a rationed clip; otherwise `private, max-age=3600`.'
          schema: { type: string }
    MediaRedirect:
      description: |
        The asset lives in the public media bucket; `Location` is its CDN
        address. Question images are content-addressed — the key is the SHA-256
        of the bytes — so the target can never become different bytes and both
        the redirect and the image itself are safely cacheable.

        Sent only when a public bucket is configured. Without one the same route
        answers `200` with the bytes, which is what local development does.

        Listening audio never answers this way while an attempt is in progress:
        R-01 rations a clip to one play, and the store holding it exposes no URL.
      headers:
        Location:
          description: The CDN address of the asset.
          schema: { type: string, format: uri }
        Cache-Control:
          description: '`private, max-age=3600`.'
          schema: { type: string }
    NotModified:
      description: |
        The caller's `If-None-Match` matched the asset's ETag, so the bytes it
        already holds are current. Sent only by routes that ration nothing — a
        listening clip under R-01 carries no ETag to revalidate, because the
        play is charged before the response and `no-store` leaves the client no
        copy a 304 could point back at.
      headers:
        ETag:
          description: The asset's SHA-256, the same validator that was sent.
          schema: { type: string }
        Cache-Control:
          description: '`private, max-age=3600`.'
          schema: { type: string }
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Not signed in, or the access token has expired.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Signed in, but lacking the required permission.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource, or it does not belong to the caller.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The request conflicts with the resource's current state.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Well-formed but invalid.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    # ── errors ──────────────────────────────────────────────────────────────

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        # RFC 9457's standard member for the specific occurrence. Nothing
        # populates it today, but `httpx.Problem` carries the field and would
        # otherwise emit a member no generated client declares.
        instance: { type: string }
        code: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    AttemptInProgressProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            inProgressAttempt: { $ref: '#/components/schemas/AttemptSummary' }

    # ── auth ────────────────────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        displayName: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    AuthTokens:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: |
            Short-lived. Hold it in memory only — the refresh token travels in
            an httpOnly cookie precisely so that neither survives an XSS.
        expiresIn: { type: integer, description: Seconds until the access token expires. }
        user: { $ref: '#/components/schemas/CurrentUser' }

    CurrentUser:
      type: object
      required: [id, email, emailVerified, displayName, roles, permissions]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        displayName: { type: string }
        locale: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }

    # ── catalog ─────────────────────────────────────────────────────────────

    ExamLevel:
      type: string
      enum: [TOPIK_I, TOPIK_II]

    SectionKind:
      type: string
      enum: [LISTENING, WRITING, READING]

    AttemptMode:
      type: string
      enum: [PRACTICE, EXAM]

    MyCardWordbookSource:
      type: object
      required: [examId, examCode, examTitle, entryId]
      description: |
        One paper whose bảng từ vựng holds this word — a destination, not a
        label. SC-EXAM-WORDBOOK opens on an exam and scrolls to an entry, so a
        client can make this a link.

        It carries no meaning and no example: the card's own back already holds
        the contextual meaning it was saved with. This answers where, not what.
      properties:
        examId: { type: string, format: uuid }
        examCode: { type: string }
        examTitle: { type: string }
        entryId: { type: string, format: uuid }

    Wordbook:
      type: object
      required: [examId, examCode, examTitle, bankSize, items]
      properties:
        examId: { type: string, format: uuid }
        examCode: { type: string }
        examTitle: { type: string }
        bankSize:
          type: integer
          description: |
            How many papers have been published in the bank — the denominator
            of every *hay gặp* label, sent once rather than repeated on each
            entry because it is a fact about the bank and not about the word.

            R-33 requires the label to carry its count: "Hay gặp — 4 trong 12
            đề" lets a learner judge how much to trust it, where a bare star
            cannot be judged.
        items:
          type: array
          items: { $ref: '#/components/schemas/WordbookItem' }

    WordbookItem:
      type: object
      required: [id, kind, headwordKo, readingLatin, partOfSpeech, contextMeaningVi, meaningVi, audioUrl, examples, occurrences]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/WordbookKind' }
        headwordKo: { type: string }
        readingLatin:
          type: string
          description: Cách đọc, in Latin script — R-33's second of six things.
        partOfSpeech: { $ref: '#/components/schemas/WordbookPartOfSpeech' }
        contextMeaningVi:
          type: string
          description: |
            The meaning in THIS paper, and the primary one — R-33 shows it
            first and offers the general meaning as "xem thêm".

            It may never repeat `meaningVi`. That is điều cấm số 2 of ver1.2:
            copying the gloss across "biến bảng này thành một danh sách từ mà
            bất kỳ app miễn phí nào cũng có". Enforced by a database CHECK and
            by the import gate, so a client can render both lines knowing they
            say different things.
        meaningVi:
          type: string
          description: Nghĩa chung, available as "see also" and never in place of the above.
        audioUrl:
          type: string
          description: |
            Where the pre-generated clip lives.

            **Absolute** on a deployment with a public bucket — hand it to an
            `<audio>` element, and the tenth play is a browser cache hit that
            reaches no server. **Root-relative** without one, where it
            addresses this API and needs a credential. Tell them apart by the
            leading slash, not by parsing: a public base URL may legitimately
            be http on localhost.

            The clip is a file, never a call. YC-502: synthesising on play is
            "biến phí theo đầu người" with no ceiling.
        examples:
          type: array
          minItems: 2
          maxItems: 2
          description: |
            Đúng hai, không một, không ba (R-33). An entry that does not have
            exactly two is not returned at all.
          items: { $ref: '#/components/schemas/WordbookExample' }
        occurrences:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WordbookOccurrence' }
        frequent: { $ref: '#/components/schemas/WordbookFrequent' }
        card: { $ref: '#/components/schemas/WordbookCardRef' }

    WordbookPartOfSpeech:
      type: string
      enum: [NOUN, VERB, ADJECTIVE, ADVERB, GRAMMAR_PATTERN]
      description: |
        The same five values ShadowPartOfSpeech carries, and the same five the
        dictation glossary uses inline. A third copy rather than one shared
        schema, matching what is already here — merging them is a rename across
        three generated clients and belongs in its own change, not in this one.

    WordbookKind:
      type: string
      enum: [VOCAB, GRAMMAR]
      description: |
        R-33's two lists. They are rendered apart and never merged: "người học
        ôn từ vựng và ôn ngữ pháp là hai việc khác nhau, và họ thường chỉ muốn
        làm một trong hai tại một lúc."

    WordbookExample:
      type: object
      required: [textKo, textVi]
      properties:
        textKo: { type: string }
        textVi: { type: string }
        fromQuestionOrdinal:
          type: integer
          description: |
            The number printed on the paper, when this sentence came out of it
            — a real sentence is preferred because "người học vừa gặp câu đó,
            nối lại được ngay".

            Absent for a câu soạn thêm. TCCN-502-3 makes that absence
            meaningful: a written sentence records no position at all rather
            than a vague one.

    WordbookOccurrence:
      type: object
      required: [questionId, displayOrdinal, sectionKind]
      properties:
        questionId: { type: string, format: uuid }
        displayOrdinal:
          type: integer
          description: |
            The number printed on the paper — which on a TOPIK II reading
            question is not the storage ordinal, because those restart at 1
            after Listening and Writing occupy 1–54.
        sectionKind: { $ref: '#/components/schemas/SectionKind' }

    WordbookFrequent:
      type: object
      required: [examCount]
      description: |
        YC-507's *hay gặp* label. **Absent** for an entry found in one or two
        papers, and R-33 calls that "trạng thái bình thường — không phải thiếu
        dữ liệu": no dim badge, no "chưa đủ dữ liệu".

        It is a statistic over papers already sat, never a prediction. The
        screen must not say "từ này sẽ ra" or "nên học vì sắp thi" — same
        reason as điều cấm số 3 of ver1.1: the product does not forecast the
        real exam.
      properties:
        examCount:
          type: integer
          description: |
            How many published papers contain this headword, counted by PAPER
            and never by occurrence. A word appearing five times in one paper
            is one paper — that says something about that paper, not about how
            often the word comes up.

    WordbookCardRef:
      type: object
      required: [id, state]
      description: |
        The caller's card for this word, from any source — a wrong answer, a
        video, another paper's wordbook. One deck (R-15), and ver1.2's overview
        calls that "nguyên tắc lớn nhất của cả sản phẩm".

        Present on load rather than discovered by trying to save, because
        YC-504 filters on it and TCCN-503-3 needs the screen to know before the
        learner presses anything.
      properties:
        id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/CardState' }

    WordbookSourceSentence:
      type: object
      required: [questionId, displayOrdinal, sectionKind, stemKo, inPassage, charStart, charEnd]
      properties:
        questionId: { type: string, format: uuid }
        displayOrdinal: { type: integer }
        sectionKind: { $ref: '#/components/schemas/SectionKind' }
        stemKo: { type: string }
        stemVi: { type: string }
        passageKo:
          type: string
          description: |
            The passage the question is read with, when it has one. For a
            listening question this is the transcript — the wordbook is read
            after the paper, so there is nothing left to ration.
        passageVi: { type: string }
        inPassage:
          type: boolean
          description: Which of the two texts above the offsets below measure.
        charStart:
          type: integer
          description: |
            Where the headword sits, in **Unicode code points** — the unit
            every offset in this API uses. Postgres `substring()`, Go `[]rune`
            and JavaScript `Array.from()` agree; `String.slice` does not.
        charEnd: { type: integer }

    ExamListItem:
      type: object
      required: [id, code, title, level, questionCount, attemptCount]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        level: { $ref: '#/components/schemas/ExamLevel' }
        year: { type: integer }
        questionCount: { type: integer }
        attemptCount:
          type: integer
          description: How many times the caller has taken this exam.
        bestScore:
          type: integer
          description: |
            The caller's best total. Absent when they have never submitted an
            attempt — which the list screen renders as its empty state rather
            than as a zero (R-13).
        lastAttemptedAt: { type: string, format: date-time }
        hasWordbook:
          type: boolean
          description: |
            Whether this paper has a bảng từ vựng a learner can open
            (R-33, YC-506).

            SC-TEST-LIST is one of the two mandatory ways in, and neither
            requires having sat the paper — "Không bắt phải làm đề mới được xem
            bảng." False for a paper nobody has authored one for, and false for
            one whose entries are all still incomplete, so the screen never
            offers a control that leads to an empty page.

    ExamDetail:
      type: object
      required: [id, code, title, level, blueprintVersion, totalScore, sections]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        level: { $ref: '#/components/schemas/ExamLevel' }
        blueprintVersion: { type: string }
        totalScore: { type: integer }
        hasTranslations:
          type: boolean
          description: |
            False when this exam has no Vietnamese content, in which case the
            client hides the translation toggle entirely rather than showing it
            disabled (TCCN-121-3).
        sections:
          type: array
          items: { $ref: '#/components/schemas/ExamSection' }

    ExamSection:
      type: object
      required: [kind, ordinal, questionCount, timeLimitSeconds, maxScore]
      properties:
        kind: { $ref: '#/components/schemas/SectionKind' }
        sitting: { type: integer }
        ordinal: { type: integer }
        questionCount: { type: integer }
        timeLimitSeconds: { type: integer }
        maxScore: { type: integer }

    # ── attempt (runner) ────────────────────────────────────────────────────

    StartAttemptRequest:
      type: object
      required: [examId, mode]
      properties:
        examId: { type: string, format: uuid }
        mode: { $ref: '#/components/schemas/AttemptMode' }
        sections:
          type: array
          description: |
            PRACTICE only (YC-102). Omitted or empty means the whole paper.

            Sending this in EXAM mode is a 422 rather than being ignored: R-01
            says a Thi thử sits every section, and a client that offered the
            choice and silently got the whole paper would have told the learner
            something untrue about what they were about to sit.

            The attempt contains exactly these sections and nothing else
            (TCCN-102-3), and a paper missing a section cannot produce a band.
          items: { $ref: '#/components/schemas/SectionKind' }

    AttemptSummary:
      type: object
      required: [id, examId, examTitle, mode, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        examId: { type: string, format: uuid }
        examTitle: { type: string }
        mode: { $ref: '#/components/schemas/AttemptMode' }
        status:
          type: string
          enum: [IN_PROGRESS, SUBMITTED, ABANDONED]
        startedAt: { type: string, format: date-time }
        unansweredCount: { type: integer }

    AttemptRunner:
      type: object
      description: |
        Everything the runner screen needs, and deliberately nothing more.

        There is no correctness field anywhere in this tree, in either mode.
        The review response is a separate schema that shares no structure with
        this one, so a field cannot be added to both by accident.
      required: [id, examId, examTitle, mode, status, startedAt, sections, questions]
      properties:
        id: { type: string, format: uuid }
        examId: { type: string, format: uuid }
        examTitle: { type: string }
        mode: { $ref: '#/components/schemas/AttemptMode' }
        status:
          type: string
          enum: [IN_PROGRESS, SUBMITTED, ABANDONED]
        startedAt: { type: string, format: date-time }
        currentQuestionId: { type: string, format: uuid }
        translationVisible:
          type: boolean
          description: Defaults to false — the learner reads for themselves first (R-07).
        serverTime:
          type: string
          format: date-time
          description: |
            Sent so the client can measure its clock offset. EXAM deadlines are
            absolute instants, and a device with a skewed clock would otherwise
            show the wrong remaining time.
        sections:
          type: array
          items: { $ref: '#/components/schemas/AttemptSectionState' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/RunnerQuestion' }
        answers:
          type: array
          items: { $ref: '#/components/schemas/AnswerState' }
        writingProgress:
          type: array
          description: |
            The writing section's equivalent of `answers`: enough for the
            question palette to tell a written task from a blank one, and not
            one word of what was written.
          items: { $ref: '#/components/schemas/WritingProgress' }

    AttemptSectionState:
      type: object
      required: [kind, ordinal, status, timeLimitSeconds]
      properties:
        kind: { $ref: '#/components/schemas/SectionKind' }
        ordinal: { type: integer }
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, SUBMITTED]
        timeLimitSeconds: { type: integer }
        deadlineAt:
          type: string
          format: date-time
          description: |
            EXAM only. An absolute instant, not a remaining duration: closing
            the browser for twelve minutes has to cost twelve minutes
            (TCCN-106-2), which a countdown the client owns cannot guarantee.
        paused:
          type: boolean
          description: |
            PRACTICE only. True when the clock is stopped, so a resumed attempt
            comes back paused rather than quietly counting the time the learner
            deliberately stepped away for.
        elapsedMs:
          type: integer
          format: int64
          description: PRACTICE only — accumulates while the screen is open (TCCN-106-3).

    RunnerQuestion:
      type: object
      description: |
        A question as the learner sees it while working.

        No `isCorrect`, no `whyWrong`, no `explanation`, no `evidence`. Adding
        any of them here would leak the answer key to anyone reading the
        network tab, and would do so silently — a Go reflection test fails the
        build if a field matching those names appears in the corresponding
        struct.
      required: [id, ordinal, sectionKind, type, stemKo, choices]
      properties:
        id: { type: string, format: uuid }
        ordinal:
          type: integer
          description: Official learner-facing number within the paper section.
        sectionKind: { $ref: '#/components/schemas/SectionKind' }
        type:
          type: string
          enum: [MCQ, FILL_BLANK, ESSAY]
        stemKo: { type: string }
        stemVi: { type: string }
        maxScore: { type: integer }
        passage: { $ref: '#/components/schemas/RunnerPassage' }
        choices:
          type: array
          items: { $ref: '#/components/schemas/RunnerChoice' }
        lengthRange:
          allOf: [{ $ref: '#/components/schemas/WritingLengthRange' }]
          description: |
            Present on a writing task. Read from exam_blueprints.writing_tasks,
            never from a constant: GĐ-1 warns the paper's shape changes between
            years, so "600–700" is data (R-16).
        blanks:
          type: array
          description: |
            Present on Q51/Q52. Position only — the accepted answers are the
            answer key and never leave the server (TCCN-202-1).
          items: { $ref: '#/components/schemas/WritingBlank' }

    AudioTicket:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
          description: |
            Put this straight into `<audio src>`. It carries the ticket in its
            query string, because an audio element cannot send an
            `Authorization` header.
        expiresAt:
          type: string
          format: date-time
          description: |
            Minutes away. Long enough to cover the clip plus a stall — a ticket
            that expired mid-sentence would cost the learner the listen they
            already paid for.

    RunnerPassage:
      type: object
      required: [id, kind]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [TEXT, AUDIO]
        bodyKo: { type: string }
        bodyVi: { type: string }
        audioPublicUrl:
          type: string
          description: |
            The clip's address on the CDN, and what the player reads whenever it
            is present. Costs no request to this API at all: it is here before
            the learner presses play, so the browser can buffer the clip while
            they read the question, and it is served from the Cloudflare edge.

            Not scoped to an attempt, a learner or a clock, and it does not
            expire. R-01's single listen is enforced by the client against this
            URL. `AUDIO_PLAYED` is still recorded through `POST
            /attempts/{attemptId}/events`, so the play stays auditable and a
            reload still finds the stimulus spent — but the server no longer
            refuses a second one.

            Absent on a deployment with no public bucket, which is the signal to
            use the two fields below instead.
        audioUrl:
          type: string
          description: |
            Fetch the whole clip, recording the play as it serves. Needs the
            bearer token, so a browser client has to buffer the file before
            anything can sound. The fallback path when `audioPublicUrl` is
            absent.
        audioTicketUrl:
          type: string
          description: |
            POST here instead to spend the same single listen and get back a URL
            an `<audio>` element can read, which starts playing on the first
            chunk. Both paths record one `AUDIO_PLAYED`; using both spends two.
            Also a fallback: prefer `audioPublicUrl` when it is present.
        audioPlayed:
          type: boolean
          description: |
            This stimulus has already been listened to in this attempt. Read
            from the `AUDIO_PLAYED` events the client reports, keyed by passage
            so a listening group that shares one recording counts once.

            What a resumed or reloaded runner enforces its one-play rule from:
            without it a reload would present a fresh play button, which is the
            most common way a second listen happens. Meaningless in PRACTICE,
            where replaying is unlimited.
        images:
          type: array
          items: { $ref: '#/components/schemas/ExamImage' }

    RunnerChoice:
      type: object
      required: [ordinal, textKo]
      properties:
        ordinal: { type: integer, minimum: 1, maximum: 4 }
        textKo: { type: string }
        textVi: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/ExamImage' }

    ExamImage:
      type: object
      required: [id, ordinal, url, altKo]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1 }
        url: { type: string }
        altKo: { type: string }
        altVi: { type: string }

    RecordAnswerRequest:
      type: object
      required: [clientSeq]
      properties:
        selectedChoiceOrdinal:
          type: [integer, 'null']
          minimum: 1
          maximum: 4
          description: Null clears the answer back to skipped.
        flagged:
          type: boolean
          description: Independent of the answer — flagged and answered is valid (R-02).
        clientSeq:
          type: integer
          format: int64
          description: Monotonic per client; an older write never overwrites a newer one.

    AnswerState:
      type: object
      required: [questionId, flagged]
      properties:
        questionId: { type: string, format: uuid }
        selectedChoiceOrdinal: { type: [integer, 'null'] }
        flagged: { type: boolean }
        answeredAt: { type: string, format: date-time }

    # ── result ──────────────────────────────────────────────────────────────

    AttemptResult:
      type: object
      required:
        [attemptId, examId, mode, totalScore, maxTotalScore, correctCount, wrongCount,
         skippedCount, voidedCount, sections, submittedAt, hasWordbook]
      properties:
        attemptId: { type: string, format: uuid }
        examId: { type: string, format: uuid }
        examTitle: { type: string }
        hasWordbook:
          type: boolean
          description: |
            Whether this paper has a bảng từ vựng to offer (R-33, YC-506).

            SC-TEST-RESULT is the first of the two mandatory entry points, and
            R-33 calls it the moment a learner wants it most — "đây là lúc
            người học muốn nhất". False for a paper with no wordbook, so the
            screen offers nothing rather than a control that leads nowhere.
        mode: { $ref: '#/components/schemas/AttemptMode' }
        totalScore: { type: integer }
        maxTotalScore: { type: integer }
        correctCount: { type: integer }
        wrongCount:
          type: integer
          description: |
            Answered and wrong. Kept apart from skipped because "did not know"
            and "ran out of time" are different problems needing different
            responses (R-05).
        skippedCount: { type: integer }
        voidedCount:
          type: integer
          description: |
            Questions dropped because the system failed — an audio file that
            would not load after three retries (R-12). Excluded from wrong;
            our outage is not the learner's mistake.
        elapsedMs: { type: integer, format: int64 }
        submittedAt: { type: string, format: date-time }
        sections:
          type: array
          items: { $ref: '#/components/schemas/SectionResult' }
        estimatedBand: { $ref: '#/components/schemas/EstimatedBand' }
        bandWithheldReason:
          type: string
          enum: [PRACTICE_MODE, INCOMPLETE_SECTIONS, NOT_A_FULL_PAPER, WRITING_PENDING]
          description: |
            Present instead of `estimatedBand` when no level may be shown at
            all. The screen states which rule applied rather than silently
            omitting the row.
        writingSubmissions:
          type: array
          description: |
            Where the writing section's score leads. Every other number on the
            result screen links to the questions it counts (CR-03); the writing
            section cannot use the review screen, which shows choices and
            explanations an essay does not have.
          items: { $ref: '#/components/schemas/AttemptWritingSubmissionRef' }
        includesMachineMarkedScore:
          type: boolean
          description: |
            True when the total contains an AI-marked writing score. The total
            is still the real 300-point total, because the actual exam counts
            writing the same way — but it must not be displayed without the
            "phần Viết do máy chấm — điểm ước tính" note beside it.

    SectionResult:
      type: object
      required: [kind, correct, wrong, skipped, total, scaledScore, maxScore, machineMarked]
      properties:
        kind: { $ref: '#/components/schemas/SectionKind' }
        correct: { type: integer }
        wrong: { type: integer }
        skipped: { type: integer }
        voided: { type: integer }
        total: { type: integer }
        scaledScore:
          type: integer
          description: On the section's own 100-point scale, not a count of right answers (R-05).
        maxScore: { type: integer }
        elapsedMs: { type: integer, format: int64 }
        machineMarked:
          type: boolean
          description: The writing section, shown apart from the marked-by-machine sections (TCCN-203-2).

    EstimatedBand:
      type: object
      description: |
        An estimated level, never an exam result.

        `disclaimer` is a required field rather than something the client
        supplies, so the caveat cannot be lost between the API and the screen.
        Điều cấm #1 is that a learner might believe they have reached cấp 4,
        pay to sit the real exam, and fail.
      required: [band, achieved, hasNextBand, disclaimer, blueprintVersion]
      properties:
        band:
          type: integer
          minimum: 0
          maximum: 6
          description: |
            0 means "chưa đạt cấp nào" — a complete paper that landed below the
            lowest threshold. That is a real result with a real gap to report
            (TCCN-107-8), distinct from a band being withheld.
        achieved: { type: boolean }
        hasNextBand:
          type: boolean
          description: |
            False at the top band, where there is nothing left to climb toward.
            Required, and the only thing a client may branch on: `nextBand` and
            `pointsToNext` are omitted when zero, so their absence cannot tell
            "no band above this one" apart from "the value happened to be 0".
        nextBand: { type: integer }
        pointsToNext:
          type: integer
          description: '"Còn 1 điểm nữa để đạt cấp 2" (TCCN-107-7).'
        marginOverCurrent:
          type: integer
          description: Headroom over the threshold just cleared (TCCN-107-2).
        blueprintVersion: { type: string }
        disclaimer: { type: string }
        thresholdNote:
          type: string
          description: |
            The reminder that thresholds come from the published exam rules and
            should be re-checked against the most recent sitting (TCCN-107-3).

    # ── review ──────────────────────────────────────────────────────────────

    ReviewCounts:
      type: object
      required: [all, wrong, skipped, flagged]
      properties:
        all: { type: integer }
        wrong: { type: integer }
        skipped: { type: integer }
        flagged: { type: integer }

    AttemptEventRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            - AUDIO_PLAYED
            - AUDIO_LOAD_FAILED
            - AUDIO_SKIPPED_SYSTEM_ERROR
            - PAUSED
            - RESUMED
        questionId: { type: string, format: uuid }
        payload:
          type: object
          additionalProperties: true
          description: Free-form detail, e.g. the failure count that led to a skip.

    AttemptHistoryRow:
      type: object
      required: [id, examId, examTitle, examCode, level, mode, kind, status, startedAt, sectionsSat]
      properties:
        id: { type: string, format: uuid }
        examId: { type: string, format: uuid }
        examTitle: { type: string }
        examCode: { type: string }
        level: { $ref: '#/components/schemas/ExamLevel' }
        mode: { $ref: '#/components/schemas/AttemptMode' }
        kind:
          type: string
          enum: [FULL, SECTION, WRONG_REDO, GENERATED]
        status:
          type: string
          enum: [IN_PROGRESS, SUBMITTED, ABANDONED]
        startedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time }
        totalScore:
          type: integer
          description: |
            Absent unless the attempt was actually scored, so an unfinished
            paper renders as nothing rather than as a zero.
        maxTotalScore: { type: integer }
        sectionsSat:
          type: array
          items: { $ref: '#/components/schemas/SectionKind' }

    ReviewQuestion:
      type: object
      description: |
        A question after submission, with everything the runner response
        withholds.

        Layers 2 to 5 are optional here in the strict sense: a layer the exam
        author never wrote is absent from the JSON, so the client renders
        nothing rather than an empty frame (R-07 constraint 3, TCCN-112-4).
      required: [id, ordinal, sectionKind, stemKo, outcome, correctChoiceOrdinal, choices, topics]
      properties:
        id: { type: string, format: uuid }
        ordinal:
          type: integer
          description: Official learner-facing number within the paper section.
        sectionKind: { $ref: '#/components/schemas/SectionKind' }
        stemKo: { type: string }
        stemVi: { type: string }
        passage: { $ref: '#/components/schemas/ReviewPassage' }
        outcome:
          type: string
          enum: [CORRECT, WRONG, SKIPPED, VOIDED]
        selectedChoiceOrdinal: { type: [integer, 'null'] }
        correctChoiceOrdinal: { type: integer }
        flagged: { type: boolean }
        choices:
          type: array
          items: { $ref: '#/components/schemas/ReviewChoice' }
        writing:
          allOf: [{ $ref: '#/components/schemas/ReviewWritingMark' }]
          description: |
            Present only on a writing task, and its presence is what a client
            must branch on before reading `outcome`, `choices`,
            `selectedChoiceOrdinal` or `correctChoiceOrdinal`. None of those
            mean anything for an essay: there are no choices to select and
            nothing to compare an answer against. They carry zero values rather
            than being omitted only because the contract types them required.

            In particular `outcome` reads `SKIPPED` on a writing task whose
            essay the learner wrote in full, because it is derived from a
            chosen ordinal that a writing task can never have. For the same
            reason a writing task is counted in `counts.all` but never in
            `counts.wrong` or `counts.skipped`, and never appears under the
            `wrong` or `skipped` filters.
        explanationCorrect:
          $ref: '#/components/schemas/LocalisedText'
          description: |
            Layer 2 — why the right answer is right. Shown for every question,
            including ones answered correctly: answering right by elimination
            is a wrong answer that has not happened yet (R-07, YC-112).
        explanationWrongGeneric:
          $ref: '#/components/schemas/LocalisedText'
          description: |
            Layer 3 fallback, used when the author wrote one shared note rather
            than a per-distractor one (TCCN-112-3).
        evidence:
          type: array
          description: Layer 4. Absent entirely when the question has no source material (TCCN-114-3).
          items: { $ref: '#/components/schemas/ReviewEvidence' }
        topics:
          type: array
          description: |
            Layer 5, as tappable chips. Topics authored with the exam arrive
            already attached, so the learner does not re-tag what the author
            already identified (R-07 constraint 1, TCCN-108-4).
          items: { $ref: '#/components/schemas/AttachedTopic' }

    ReviewPassage:
      type: object
      required: [id, kind]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [TEXT, AUDIO]
        bodyKo: { type: string }
        bodyVi: { type: string }
        transcriptKo: { type: string }
        transcriptVi: { type: string }
        audioUrl:
          type: string
          description: |
            The clip, replayable without limit — TCCN-114-2 is explicit that
            R-01's single listen governs sitting the paper and not studying it
            afterwards. A CDN address on a deployment with a public bucket, and
            the authenticated review route otherwise.
        images:
          type: array
          items: { $ref: '#/components/schemas/ExamImage' }

    ReviewWritingMark:
      type: object
      description: |
        What a review card can honestly say about a machine-marked essay: its
        score, and where to read the marking.

        Deliberately not the mark itself — no essay text, no corrections, no
        criteria breakdown. SC-WRITE-RESULT renders those, and a machine mark
        disclosed in two places is a machine mark that can be disclosed two
        different ways (điều cấm #1).
      required: [submissionId, status, awardedScore, maxScore]
      properties:
        submissionId:
          type: string
          format: uuid
          description: The submission to open on SC-WRITE-RESULT.
        status: { $ref: '#/components/schemas/WritingStatus' }
        awardedScore:
          type: [integer, 'null']
          description: |
            Null until the mark lands, so a card says "Đang chấm…" rather than
            showing a zero that is really an absence.
        maxScore:
          type: integer
          description: |
            This task's own maximum — 10 for câu 51, 50 for câu 54 — not the
            writing section's 100.

    ReviewChoice:
      type: object
      required: [ordinal, textKo, isCorrect]
      properties:
        ordinal: { type: integer }
        textKo: { type: string }
        textVi: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/ExamImage' }
        isCorrect: { type: boolean }
        whyWrong:
          $ref: '#/components/schemas/LocalisedText'
          description: |
            Layer 3, specific to this distractor — two learners who chose
            differently read different explanations (TCCN-112-3).

    ReviewEvidence:
      type: object
      properties:
        passageId: { type: string, format: uuid }
        charStart: { type: integer }
        charEnd: { type: integer }
        audioStartMs: { type: integer }
        audioEndMs: { type: integer }
        quote: { $ref: '#/components/schemas/LocalisedText' }

    LocalisedText:
      type: object
      properties:
        ko: { type: string }
        vi: { type: string }

    AttachedTopic:
      type: object
      required: [id, category, name, source]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/TopicCategory' }
        name: { type: string }
        source:
          type: string
          enum: [AUTHORED, LEARNER]
          description: Whether the exam author attached this or the learner did.

    AttemptTopicSummaryRow:
      type: object
      required: [topic, wrongCount, totalCount]
      properties:
        topic: { $ref: '#/components/schemas/Topic' }
        wrongCount: { type: integer }
        totalCount: { type: integer }
        questionIds:
          type: array
          description: So tapping the row filters the review list to exactly these questions.
          items: { type: string, format: uuid }

    # ── topics ──────────────────────────────────────────────────────────────

    TopicCategory:
      type: string
      enum: [GRAMMAR, VOCAB, READING_SKILL, LISTENING_SKILL]

    Topic:
      type: object
      required: [id, category, name, isSystem]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/TopicCategory' }
        name: { type: string }
        isSystem:
          type: boolean
          description: Curated topics seed the suggestion list and rank above learner-created ones.

    QuestionTopicsResult:
      type: object
      required: [topics, added, retracted]
      properties:
        topics:
          type: array
          items: { $ref: '#/components/schemas/AttachedTopic' }
        added: { type: integer }
        retracted:
          type: integer
          description: |
            Topics removed. Recorded as retractions rather than deletions —
            the error log is append-only (điều cấm #2).

    # ── cards ───────────────────────────────────────────────────────────────

    CreateCardRequest:
      type: object
      required: [type, front]
      properties:
        type:
          type: string
          enum: [VOCAB, GRAMMAR, STRUCTURE_TEMPLATE]
        front: { type: string, minLength: 1 }
        back: { type: string }
        sourceQuestionId:
          type: string
          format: uuid
          description: The question the card was made from (TCCN-109-1).
        sourceAttemptId:
          type: string
          format: uuid
          description: |
            The attempt it was made from. Send it with `sourceQuestionId` and
            the card inherits the chủ điểm the learner actually has on that
            question — the error log minus retractions, the same set the review
            screen shows — instead of only the ones the author attached.
            Without it the card falls back to the authored topics, which is
            weaker but still connected (TCCN-115-1).
        sourceShadowLineId:
          type: string
          format: uuid
          description: |
            The shadowing line this word was saved from (R-19, TCCN-353-5).
            R-15 lists "video nào" among the three answers to "thẻ này từ đâu
            ra" and calls it the line authors forget.

            It is also what makes the card shadowable: SC-SHADOW-LIST's card
            tab is exactly the rows carrying this, because a card made from a
            reading question has no sentence anyone can hear.
        sourceDictationItemId:
          type: string
          format: uuid
          description: |
            The dictation sentence this word was mistyped in (R-36, YC-426).
            R-15 lists provenance among the three answers to "thẻ này từ đâu
            ra" and calls it the row authors forget.

            Unlike `sourceShadowLineId` this does NOT make the card shadowable.
            R-15's test for that is a sentence you can hear, which a dictation
            item is — but SC-SHADOW-LIST's card tab opens the shadowing player,
            and that plays a video this card has no video for. Widening it is a
            decision about that screen, not a side effect of recording where a
            card came from.
        sourceWordbookEntryId:
          type: string
          format: uuid
          description: |
            The bảng từ vựng entry this word was saved from (R-33, YC-503).

            Recorded whether a card was created or one already existed, which
            is what makes TCCN-503-3 answerable: saving 접수 from this paper
            having already saved it from a video creates **no second card**,
            and the card that exists gains a line saying it also appears here.
            The response still reports `alreadyExisted: true`, so the screen
            says "Từ này đã có trong bộ thẻ của bạn" and offers the way to it.

    CardResult:
      type: object
      required: [id, type, front, deckId, deckName, state, alreadyExisted]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        front: { type: string }
        back: { type: string }
        deckId: { type: string, format: uuid }
        deckName: { type: string }
        state:
          allOf: [{ $ref: '#/components/schemas/CardState' }]
          description: |
            R-15's three states.

            A card that was just created is always Mới, so on that branch this
            is a constant. The other branch is why it travels: a word saved
            from a video three weeks ago may be Đang học, and a screen that
            shows state — SC-EXAM-WORDBOOK does, because YC-504 filters on it —
            would otherwise guess Mới or refetch a whole list to find out.
        alreadyExisted:
          type: boolean
          description: |
            True when a card for this term was already in the collection. The
            existing card is returned unchanged — in particular its review
            schedule is untouched (TCCN-115-2).

    CardBatchResult:
      type: object
      required: [created, alreadyExisted, cards]
      properties:
        created: { type: integer }
        alreadyExisted: { type: integer }
        cards:
          type: array
          items: { $ref: '#/components/schemas/CardResult' }

    CardState:
      type: string
      enum: [NEW, LEARNING, KNOWN]
      description: |
        R-15's three states — Mới, Đang học, Đã nhớ. Set by the learner and
        never computed. Only NEW and LEARNING appear in the daily list; KNOWN
        is what takes a card out of it.

    MyCard:
      type: object
      description: |
        One card as it appears in the learner's own collection.

        Carries no review schedule; see the note on `GET /me/cards`.
      required: [id, type, front, deckId, deckName, state, topics, createdAt, wordbookSources]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [VOCAB, GRAMMAR, STRUCTURE_TEMPLATE]
        front: { type: string }
        back:
          type: string
          description: |
            Absent when the learner saved no meaning, rather than an empty
            string — the client renders nothing instead of a blank second line,
            which is R-07 constraint 3's rule applied to a card.
        deckId: { type: string, format: uuid }
        deckName: { type: string }
        state: { $ref: '#/components/schemas/CardState' }
        topics:
          type: array
          description: |
            The chủ điểm this card inherited when it was made (TCCN-115-1).
            Empty is meaningful rather than missing: the card is not connected
            to the weakness picture, and the screen says so in those words.
          items: { $ref: '#/components/schemas/Topic' }
        createdAt: { type: string, format: date-time }
        wordbookSources:
          type: array
          description: |
            Which papers' bảng từ vựng hold this word (R-33, YC-503).

            A LIST, and the only provenance on a card that is one. The three
            below each answer "thẻ này từ đâu ra" with a single place, which is
            right for them — a card is made from one wrong answer, one line,
            one sentence. A word is in as many papers as it is in, and
            TCCN-503-3 makes that visible on a card the learner already had.

            Empty for a card from any other source, never absent, so a client
            has one branch rather than two. A paper withdrawn from the bank
            drops out of the list rather than becoming a link to a 404.
          items: { $ref: '#/components/schemas/MyCardWordbookSource' }
        source:
          allOf: [{ $ref: '#/components/schemas/MyCardSource' }]
          description: |
            Absent when the card has no source question, or when the exam it
            came from has been removed — `cards.source_question_id` is
            ON DELETE SET NULL. Absent rather than a placeholder, so the row
            shows nothing instead of "không rõ" (TCCN-109-5).
        shadowSource:
          allOf: [{ $ref: '#/components/schemas/MyCardShadowSource' }]
          description: |
            Where a word saved from a video came from. R-15 lists "video nào"
            beside "câu làm sai nào" as an answer to "thẻ này từ đâu ra", and
            calls it the row that gets forgotten: "Người học nhìn một từ lạ sau
            ba tuần thường không nhớ mình gặp nó ở đâu" (TCCN-353-5).

            A second field rather than a second shape for `source`, and the
            difference is not cosmetic: `source` names a paper there is nothing
            to open, while this names a sentence there is — the only provenance
            in the product a client can turn into a link. Making `source`
            polymorphic would cost its five required fields, and every caller
            reading `source.examTitle` today would have to narrow first for a
            branch it will never take.

            Absent when the card was not saved from a video, and also when that
            video is no longer PUBLISHED: `GET /shadowing/videos/{videoId}`
            answers `404` for anything else, so naming it would be a link to a
            dead end. Absent rather than a placeholder — the same rule `source`
            follows (TCCN-109-5), and it matters more here because the
            placeholder would be clickable.

            Never both this and `source` in practice: a card records the
            question or the line it was made from, and creating a duplicate
            rewrites neither (TCCN-115-2). Clients render one provenance row.
        dictationSource:
          allOf: [{ $ref: '#/components/schemas/MyCardDictationSource' }]
          description: |
            Where a word saved while doing dictation came from (YC-426). The
            third answer to "thẻ này từ đâu ra", beside `source` and
            `shadowSource`, and never present at the same time as either: a card
            records the one place it was made from.

            Absent when the set has been retired, for the same reason
            `shadowSource` is: this row is a link on the collection screen, the
            learner API answers 404 for a set that is not published, and a
            chevron to a dead end is worse than no row.

    MyCardSource:
      type: object
      description: |
        The paper a card came from — the *exam*, not the attempt.

        `cards` stores `source_question_id` and `source_submission_id` and
        never an attempt id, so there is no lượt làm bài to send the learner
        back to and this must not pretend there is. R-15 asks for "câu làm sai
        nào"; this is as close as the data goes.
      required: [questionId, examId, examTitle, examCode, questionOrdinal]
      properties:
        questionId: { type: string, format: uuid }
        examId: { type: string, format: uuid }
        examTitle: { type: string }
        examCode: { type: string }
        questionOrdinal:
          type: integer
          description: |
            The learner-facing number in that paper — `display_ordinal`, the
            same one the review screen shows, not the storage ordinal.

    MyCardDictationSource:
      type: object
      description: |
        The dictation sentence a card was saved from — the set, its title, and
        the sentence's number.

        A *destination*, like `MyCardShadowSource`: SC-DICTATION opens at the
        learner's bookmark and shows "Câu n / N", so these four fields are what
        a link back needs and nothing more.

        No `textKo`. The card's front is already the word; the sentence it came
        from is somewhere to go back to, not a second thing to read on a flip
        card — and a whole Korean sentence under a two-syllable word is how the
        collection screen stops being scannable.
      required: [setId, setTitle, itemId, itemOrdinal]
      properties:
        setId: { type: string, format: uuid }
        setTitle: { type: string }
        itemId:
          type: string
          format: uuid
          description: |
            Carried for the reason `MyCardSource.questionId` is: the ordinal is
            what the learner reads, and the id is what survives a renumbering.
        itemOrdinal:
          type: integer
          minimum: 1
          description: The sentence's place in the set, 1-based.

    MyCardShadowSource:
      type: object
      description: |
        The sentence a card was saved from — the video, its title, and the
        line's number.

        Unlike `MyCardSource` this is a *destination*. SC-SHADOWING opens at one
        line, so these four fields are exactly what a link to "câu 12 của video
        này" needs and nothing more: no `startMs`, no `textKo`.
        `ShadowCardListItem` carries those because SC-SHADOW-LIST's card tab is
        a list of sentences; this is a single row under a word.
      required: [videoId, videoTitle, lineId, lineOrdinal]
      properties:
        videoId: { type: string, format: uuid }
        videoTitle: { type: string }
        lineId:
          type: string
          format: uuid
          description: |
            Carried for the reason `MyCardSource.questionId` is: the ordinal is
            what the learner and the URL use, and the id is what survives a
            renumbering.
        lineOrdinal:
          type: integer
          minimum: 1
          description: |
            The line's place in the transcript, 1-based — the same number
            `ShadowLine.ordinal` carries and the same one the player's `line`
            search parameter takes. Not an index: `?line=1` is câu 1.

    # ── writing ─────────────────────────────────────────────────────────────

    AttemptWritingSubmissionRef:
      type: object
      required: [questionId, submissionId, displayOrdinal, status]
      properties:
        questionId: { type: string, format: uuid }
        submissionId: { type: string, format: uuid }
        displayOrdinal: { type: integer }
        status: { $ref: '#/components/schemas/WritingStatus' }

    WritingProgress:
      type: object
      required: [questionId, charCount, submitted]
      properties:
        questionId: { type: string, format: uuid }
        charCount: { type: integer }
        submitted:
          type: boolean
          description: Sent for marking, as opposed to merely started.

    WritingLengthRange:
      type: object
      required: [minChars, maxChars]
      properties:
        minChars: { type: integer }
        maxChars: { type: integer }

    WritingBlank:
      type: object
      description: |
        One gap in Q51/Q52 — where it is, and nothing else. accepted_answers is
        the answer key and is not selected by any query that serves a learner.
      required: [ordinal, label]
      properties:
        ordinal: { type: integer }
        label: { type: string }

    WritingBlankAnswer:
      type: object
      required: [ordinal, text]
      properties:
        ordinal: { type: integer }
        text: { type: string }

    WritingStatus:
      type: string
      description: |
        DRAFT is being written. QUEUED and GRADING are the pending states
        TCCN-203-3 requires the screen to show. FAILED keeps the essay and
        offers a free retry (TCCN-203-4). AWAITING_QUOTA keeps the essay when
        the month's allowance is spent (TCCN-207-2).
      enum: [DRAFT, QUEUED, GRADING, GRADED, FAILED, AWAITING_QUOTA]

    WritingCriterion:
      type: string
      description: |
        The three criteria a real examiner marks against. They are reported
        separately and never summed on the wire (TCCN-203-1): "your writing was
        63" tells a learner nothing they can act on, while "language use 24 of
        40" does.
      enum: [CONTENT_COMPLETION, STRUCTURE_DEVELOPMENT, LANGUAGE_USE]

    WritingCriterionScore:
      type: object
      required: [criterion, score, maxScore]
      properties:
        criterion: { $ref: '#/components/schemas/WritingCriterion' }
        score: { type: number }
        maxScore: { type: number }

    WritingBlankResult:
      type: object
      required: [ordinal, answer, score, maxScore, adjudicated, note]
      properties:
        ordinal: { type: integer }
        answer: { type: string }
        score: { type: integer }
        maxScore: { type: integer }
        adjudicated:
          type: boolean
          description: |
            True when the authored list did not contain this answer and the
            model was asked how close it was (R-16).
        note: { type: string }

    WritingGrade:
      type: object
      description: |
        `criteria` is populated for an essay (Q53, Q54) and `blanks` for a
        fill-blank task (Q51, Q52); never both. There is no total on either —
        see WritingCriterion.
      required: [criteria, blanks, disclaimer]
      properties:
        criteria:
          type: array
          items: { $ref: '#/components/schemas/WritingCriterionScore' }
        blanks:
          type: array
          items: { $ref: '#/components/schemas/WritingBlankResult' }
        disclaimer:
          type: string
          description: |
            Required, so the number cannot reach a screen without the caveat
            that a machine produced it (điều cấm #1, R-09 constraint 1).

    WritingIssue:
      type: object
      description: |
        One mark on the essay. `charStart`/`charEnd` are offsets in Unicode code
        points — index with Array.from(text), not with String.prototype.slice,
        whose UTF-16 units shift on any character outside the BMP.
      required: [id, kind, charStart, charEnd, originalText, correctedText, explanation, criterion, uncertain]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: |
            Only DEFINITE_ERROR affects the score and produces an error-log
            entry. A STYLE_SUGGESTION is an opinion about good prose, and
            counting it would inflate every weakness figure in the product with
            things that were never wrong (TCCN-206-2).
          enum: [DEFINITE_ERROR, STYLE_SUGGESTION]
        charStart: { type: integer }
        charEnd: { type: integer }
        originalText: { type: string }
        correctedText: { type: string }
        explanation: { type: string }
        criterion: { $ref: '#/components/schemas/WritingCriterion' }
        uncertain:
          type: boolean
          description: |
            Derived server-side from the marker's confidence, so one threshold
            governs both the wording on screen and what enters the error log
            (R-09 constraint 4, TCCN-204-3).
        topicId: { type: string, format: uuid }
        topicName: { type: string }

    AssistantPanel:
      type: object
      required: [quota, suggestions, turns, available]
      properties:
        quota:
          allOf:
            - $ref: '#/components/schemas/WritingQuota'
          description: |
            The ASSIST bucket. Same shape as the grading allowance because it is
            the same ledger (00010) — R-11 rations both, in two buckets.
        suggestions:
          type: array
          items: { type: string }
          description: |
            Two or three starter questions anchored to what is on screen
            (`TCCN-562-6`). Written from the anchor, never generated: they show
            before the learner has spent anything, so a model call here would
            make opening the panel cost a lượt.
        turns:
          type: array
          items: { $ref: '#/components/schemas/AssistantTurn' }
          description: Oldest first, so the panel reads downward (`TCCN-568-1`).
        available:
          type: boolean
          description: |
            False when no AI provider is configured. The client hides the
            launcher outright rather than drawing a button that cannot answer —
            the same reasoning as `YC-565`'s "ẩn hẳn, không hiện ở trạng thái mờ".

    AssistantTurn:
      type: object
      required: [id, askedAt, question, outcome, charged, fromSaved]
      properties:
        id: { type: string, format: uuid }
        askedAt: { type: string, format: date-time }
        question: { type: string }
        outcome:
          type: string
          enum: [ANSWERED, GUIDED, NO_DATA, DECLINED, OFF_TOPIC, NO_QUOTA, FAILED]
        answer:
          allOf:
            - $ref: '#/components/schemas/AssistantAnswer'
          description: Absent for `NO_QUOTA` and `FAILED` — the question was kept, not answered.
        charged:
          type: boolean
          description: Whether this turn cost a lượt. On screen it is what makes `TCCN-564-1` and `TCCN-567-1` visible rather than merely true.
        fromSaved:
          type: boolean
          description: |
            Served from an earlier identical question about the same thing
            (`TCCN-564-1`). The client says so and offers "hỏi lại để sinh mới",
            which does charge.

    AssistantAnswer:
      type: object
      required: [kind, text, links]
      properties:
        kind:
          type: string
          enum: [ANSWERED, GUIDED, NO_DATA, DECLINED, OFF_TOPIC]
        text: { type: string }
        links:
          type: array
          items: { $ref: '#/components/schemas/AssistantLink' }

    AssistantLink:
      type: object
      required: [screen, label]
      properties:
        screen:
          type: string
          enum: [WEAKNESS, REVIEW, ATTEMPT_RESULT, ATTEMPT_HISTORY,
                 EXAM_LIST, EXAM, EXAM_WORDBOOK,
                 DECK, CARD_STUDY,
                 SHADOWING, DICTATION,
                 PLACEMENT, SETTINGS]
          description: |
            A destination, not a path. The client maps it to a route — a URL in
            this field would be a URL the model could invent, and a broken "ôn
            lại ở đây" costs more trust than the answer earned.

            Every id below is optional in the schema, but not every screen can
            do without one: `EXAM`, `EXAM_WORDBOOK`, `REVIEW` and
            `ATTEMPT_RESULT` have nowhere to land and are dropped if theirs is
            missing, while `SHADOWING` and `DICTATION` fall back to their list.
            The server also drops any id it did not put in front of the model,
            rather than passing on a destination that does not exist.

            ⛔ There is deliberately no value for a paper being sat — neither
            `SC-TEST-DO` nor the placement runner. `YC-565` hides the trợ lý on
            both, and a link into them would be that breach arriving from the
            other direction.
        label: { type: string }
        topicId: { type: string, format: uuid }
        examId: { type: string, format: uuid }
        entryId: { type: string, format: uuid }
        attemptId:
          type: string
          format: uuid
          description: One lượt làm bài, on `REVIEW` and `ATTEMPT_RESULT`.
        videoId:
          type: string
          format: uuid
          description: One video nhại theo, on `SHADOWING`.
        setId:
          type: string
          format: uuid
          description: One bộ chép chính tả, on `DICTATION`.

    AssistantAskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, maxLength: 500 }
        anchor: { $ref: '#/components/schemas/AssistantAnchor' }
        regenerate:
          type: boolean
          description: |
            Skip the saved answer and pay for a fresh one. `TCCN-564-1`'s "hỏi
            lại để sinh mới" button, and that turn does charge — the criterion
            says so, and the button says so before it is pressed.

    AssistantAnchor:
      type: object
      description: |
        What the learner had on screen. Context for the answer, and part of the
        dedupe key: R-37 scopes the saved answer to "cùng một câu hỏi về cùng
        một mục từ", so the same words asked over two papers are two questions.
      properties:
        screen:
          type: string
          enum: [EXAM_WORDBOOK, REVIEW, TEST_RESULT, WEAKNESS, DECK]
        examId: { type: string, format: uuid }
        entryId: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        questionId: { type: string, format: uuid }

    AssistantAskResult:
      type: object
      required: [turn, quota]
      properties:
        turn: { $ref: '#/components/schemas/AssistantTurn' }
        quota:
          allOf:
            - $ref: '#/components/schemas/WritingQuota'
          description: The allowance after this turn, so the counter on screen cannot drift from the ledger.

    AssistantStreamReady:
      type: object
      required: [model, promptVersion]
      description: |
        The `ready` event of `askAssistantStream`. The hold has been taken and a
        model call is starting — it is the difference between showing a cursor
        and showing a spinner that may never move.
      properties:
        model: { type: string }
        promptVersion: { type: string }

    AssistantStreamDelta:
      type: object
      required: [text]
      description: |
        One `delta` event of `askAssistantStream`. Append to what is already
        shown. Always whole sentences: the score-prediction guard runs on
        completed sentences before they are released, so a partial one is never
        sent.
      properties:
        text: { type: string }

    AssistantStreamRetract:
      type: object
      required: [reason]
      description: |
        The `retract` event of `askAssistantStream`. Everything accumulated so
        far is withdrawn; nothing follows but the terminal event.
      properties:
        reason:
          type: string
          enum: [SCORE_PREDICTION, TRUNCATED]
          description: |
            `SCORE_PREDICTION` — the answer turned into a verdict about a real
            exam and `TCCN-566-3` will not let it stand. `done` carries the
            replacement.

            `TRUNCATED` — the turn ran out of budget or lost its provider with
            text already on screen. The turn is `FAILED` and costs nothing.

    AssistantDeleteResult:
      type: object
      required: [deleted, quota]
      properties:
        deleted: { type: integer }
        quota:
          allOf:
            - $ref: '#/components/schemas/WritingQuota'
          description: Returned unchanged. "Hạn mức đã dùng không được hoàn lại" (`TCCN-568-2`).

    WritingQuota:
      type: object
      required: [bucket, remaining, limit, resetsAt]
      properties:
        bucket: { type: string }
        remaining: { type: integer }
        limit: { type: integer }
        resetsAt: { type: string, format: date-time }

    WritingDraft:
      type: object
      required: [questionId, content, blankAnswers, charCount, updatedAt]
      properties:
        questionId: { type: string, format: uuid }
        content: { type: string }
        blankAnswers:
          type: array
          items: { $ref: '#/components/schemas/WritingBlankAnswer' }
        charCount:
          type: integer
          description: |
            Counted the way the editor counts (TCCN-201-2): NFC-normalised code
            points, spaces and punctuation included, line breaks excluded.
        updatedAt: { type: string, format: date-time }

    SaveWritingDraftRequest:
      type: object
      required: [clientSeq]
      properties:
        content: { type: string }
        blankAnswers:
          type: array
          items: { $ref: '#/components/schemas/WritingBlankAnswer' }
        clientSeq:
          type: integer
          format: int64
          description: Monotonic per attempt. Older writes are discarded.

    WritingSubmission:
      type: object
      required: [id, questionId, status, version, charCount, content, blankAnswers, issues]
      properties:
        id: { type: string, format: uuid }
        questionId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WritingStatus' }
        version: { type: integer }
        charCount: { type: integer }
        content: { type: string }
        blankAnswers:
          type: array
          items: { $ref: '#/components/schemas/WritingBlankAnswer' }
        submittedAt: { type: string, format: date-time }
        gradedAt: { type: string, format: date-time }
        grade: { $ref: '#/components/schemas/WritingGrade' }
        issues:
          type: array
          items: { $ref: '#/components/schemas/WritingIssue' }
        quota:
          allOf: [{ $ref: '#/components/schemas/WritingQuota' }]
          description: |
            Present when the essay was stored but not sent for marking because
            the allowance was spent, so the screen can say when it returns.

    WritingBatchSubmitResult:
      type: object
      description: |
        The counts are carried rather than left for the screen to derive from
        the statuses: a mixed outcome — three sent, one held, one left blank —
        needs one sentence, and three derivations of it are three chances to
        disagree.
      required: [submissions, queued, awaitingQuota, skipped]
      properties:
        submissions:
          type: array
          items: { $ref: '#/components/schemas/WritingSubmission' }
        queued: { type: integer }
        awaitingQuota:
          type: integer
          description: |
            Stored but not sent, because the allowance ran out part-way through.
        skipped:
          type: integer
          description: Tasks with nothing written in them. No credit was touched.

    WritingGradeRunResult:
      type: object
      description: |
        One bounded marking pass, and what is left after it.

        `remaining` is what lets the caller decide to ask again: a pass is
        capped by a deadline and a small batch, so finishing a four-task
        writing section normally takes more than one call.
      required: [graded, failed, remaining, available]
      properties:
        graded: { type: integer }
        failed:
          type: integer
          description: |
            Runs that errored. Each released its credit, so the learner paid
            nothing and the essay is still there to retry (R-09).
        remaining:
          type: integer
          description: Essays in this attempt still QUEUED or GRADING.
        available:
          type: boolean
          description: |
            False when this deployment has no grading provider configured.
            Reported rather than raised: it is an operator's fact, not the
            learner's error, and a caller that re-sends until `remaining`
            reaches zero has to be able to stop.

    WritingTaskState:
      type: object
      required: [questionId, format, maxScore, blanks, quota]
      properties:
        questionId: { type: string, format: uuid }
        format:
          type: string
          enum: [FILL_BLANK, ESSAY]
        maxScore: { type: integer }
        lengthRange: { $ref: '#/components/schemas/WritingLengthRange' }
        blanks:
          type: array
          items: { $ref: '#/components/schemas/WritingBlank' }
        draft: { $ref: '#/components/schemas/WritingDraft' }
        latestSubmission:
          allOf: [{ $ref: '#/components/schemas/WritingSubmissionRef' }]
          description: |
            A pointer to the mark, not the mark itself. This screen is reachable
            while the attempt is still open, and a mark on Q51 contains the
            correction — which is the accepted answer to a question the learner
            may still be sitting. The result screen fetches the mark by id.
        quota: { $ref: '#/components/schemas/WritingQuota' }

    WritingSubmissionRef:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WritingStatus' }

    # ── weakness ────────────────────────────────────────────────────────────

    WeaknessRow:
      type: object
      required: [topic, encounters, wrongCount, mcqWrongCount, writingWrongCount, repeatWrongCount]
      properties:
        topic: { $ref: '#/components/schemas/Topic' }
        encounters:
          type: integer
          description: |
            Every time the learner met this topic, right or wrong. The
            denominator behind "sai 8 trên 11 lần gặp" (TCCN-108-6).
        wrongCount: { type: integer }
        skippedCount: { type: integer }
        mcqWrongCount:
          type: integer
          description: The "5 từ câu trắc nghiệm" half of TCCN-206-1.
        writingWrongCount:
          type: integer
          description: The "3 từ bài viết" half — one row, two attributed sources.
        repeatWrongCount:
          type: integer
          description: |
            Wrong again on a retry. Breaks the tie between two chủ điểm of
            equal ratio (R-08, TCCN-543-1).
        recentWrongStreak:
          type: integer
          description: |
            How many of the most recent encounters were wrong, counting back
            from the latest and stopping at the first that was not.

            The second half of TCCN-541-2's reason — "vì bạn sai 8 trên 11 lần
            gặp mẫu này, và 2 lần gần nhất vẫn sai" — and the one part of it
            the totals cannot supply, because it is about order rather than
            amount. Zero means the latest encounter was not wrong, which is a
            different statement from never wrong: the client says nothing
            rather than "0 lần".

            Optional in the schema although this server always sends it, for
            the reason `categories` gives above — the learner app deploys
            separately, so a new client may reach an old instance.
        resolved:
          type: boolean
          description: |
            The last few encounters were all correct, so this chủ điểm has left
            the đề xuất list however bad its history is (TCCN-544-1). It stays
            in the table, badged, and returns on its own the moment it goes
            wrong again, because it is derived from the log rather than stored.
        lastSeenAt: { type: string, format: date-time }

    PracticeBlockKind:
      type: string
      description: |
        Which half of YC-542's split a run came from. Kept apart on the wire
        because they are kept apart everywhere else: the two measure different
        things and must never be merged into one list.
      enum: [UNSEEN_QUESTIONS, WRONG_REDO]

    TopicPracticeBlock:
      type: object
      required: [block, count]
      properties:
        block: { $ref: '#/components/schemas/PracticeBlockKind' }
        count:
          type: integer
          minimum: 1
          description: |
            How many questions pressing this block opens, which is also how
            many the run will hold. Never zero — an empty block is absent from
            `blocks` rather than present with a count of none.

            Capped, so it is a promise the run keeps rather than the size of a
            pool it would then take a slice of.

    TopicRecommendations:
      type: object
      required: [blocks]
      properties:
        blocks:
          type: array
          description: |
            Unseen first, and that order is fixed rather than sorted: "câu chưa
            từng gặp đứng trước" is a rule about which block leads, not a
            ranking that could come out the other way on some learner's data.
          items: { $ref: '#/components/schemas/TopicPracticeBlock' }

    WeaknessCategoryRow:
      type: object
      description: |
        One nhóm chủ điểm, totalled over the learner's whole table.

        Exists because `items` is a ranked cut and summing a cut is where that
        stops being harmless. Nothing here obeys `limit`.
      required: [category, topicCount, encounters, wrongCount, skippedCount,
                 mcqWrongCount, writingWrongCount, repeatWrongCount,
                 distinctWrongQuestions, distinctEncounteredQuestions]
      properties:
        category: { $ref: '#/components/schemas/TopicCategory' }
        topicCount:
          type: integer
          description: |
            Every chủ điểm of this category the table is about, not only those
            inside `limit`. A client listing fewer rows than this has to say so
            — otherwise the count above the list reads as a miscount.
        encounters: { type: integer }
        wrongCount: { type: integer }
        skippedCount: { type: integer }
        mcqWrongCount: { type: integer }
        writingWrongCount: { type: integer }
        repeatWrongCount: { type: integer }
        distinctWrongQuestions:
          type: integer
          description: |
            Questions counted once each, rather than log entries — the count a
            client cannot derive, because the rollup hands it no question ids.

            Two things collapse. The log writes one entry per (question, topic)
            pair, so a question carrying two chủ điểm of this category is two
            entries and one question. And a question met again in a later
            sitting is a further entry each time, so a learner who sat one paper
            twice has double the entries and the same questions.

            `mcqWrongCount` answers "how many times"; this answers "how many
            questions", which is what a list of them is long. `repeatWrongCount`
            still carries the survived-a-retry signal (R-08).
        distinctEncounteredQuestions:
          type: integer
          description: |
            The denominator that matches the numerator above — every question
            met with a chủ điểm of this category attached, right or wrong.
            Writing entries carry no question and are excluded from both, which
            is why `writingWrongCount` stays attributed separately.

    # ── admin: ngân hàng đề ─────────────────────────────────────────────────

    # ── placement (SC-PLACEMENT) ──────────────────────────────────────────

    PlacementSectionKind:
      type: string
      description: |
        Only the two sections a machine can mark. R-32 keeps phần Viết out of
        the placement test because grading an essay is one AI call under R-09,
        which is not worth spending on a warm-up nobody has committed to yet.
      enum: [LISTENING, READING]

    PlacementComparison:
      type: string
      description: Where the test landed relative to the learner's own guess at step 1.
      enum: [HIGHER, SAME, LOWER]

    PlacementAvailability:
      type: object
      required: [available, maxQuestions, estimatedMinutes]
      properties:
        available:
          type: boolean
          description: False when no question in the bank carries a difficulty (TCCN-341-4).
        maxQuestions: { type: integer }
        estimatedMinutes: { type: integer }

    StartPlacementRequest:
      type: object
      required: [selfAssessedLevel]
      properties:
        selfAssessedLevel:
          type: [integer, 'null']
          minimum: 1
          maximum: 6
          description: |
            The level the learner thinks they are at, or **null** for "Tôi chưa
            biết". Null is a real answer and ranks equal with the six levels on
            screen (TCCN-345-2) — the learners who cannot name a TOPIK level
            are the ones this feature exists for.

    PlacementAnswerRequest:
      type: object
      required: [questionId, choiceId]
      properties:
        questionId: { type: string, format: uuid }
        choiceId: { type: string, format: uuid }

    SetLevelRequest:
      type: object
      required: [level]
      properties:
        level: { type: integer, minimum: 1, maximum: 6 }

    PlacementRunner:
      type: object
      required: [sessionId, status, answered, maxQuestions]
      properties:
        sessionId: { type: string, format: uuid }
        status:
          type: string
          enum: [IN_PROGRESS, SUBMITTED, ABANDONED]
        answered: { type: integer }
        maxQuestions: { type: integer }
        question:
          description: |
            Absent once the ladder has stopped — the client's signal to go to
            the result. An omitted field rather than a sentinel question with
            empty strings in it.
          $ref: '#/components/schemas/PlacementQuestion'

    PlacementQuestion:
      type: object
      required: [id, ordinal, sectionKind, stemKo, choices]
      description: |
        Carries no difficulty and no band, deliberately. TCCN-303-2 keeps
        difficulty off every learner screen — "không nhãn, không lọc, không sắp
        xếp" — and showing it would invite the learner to steer toward the easy
        questions, which ruins both the measurement and the studying.

        Carries no answer key and no explanation either, for the same reason
        `RunnerQuestion` does not.
      properties:
        id: { type: string, format: uuid }
        ordinal:
          type: integer
          description: Position within this test, 1-based. Not the question's number in its original paper.
        sectionKind: { $ref: '#/components/schemas/PlacementSectionKind' }
        stemKo:
          type: string
          description: |
            Korean only. There is no Vietnamese anywhere in this payload, and
            no toggle to reveal any.

            The attempt runner states the rule for a Thi thử and it holds here
            for the same reason: the real paper has no Vietnamese on it, and a
            learner who glossed their way through would be handed a level that
            measures someone who will not exist once the gloss is gone. The
            gloss is a Luyện tập aid; this test has no practice mode to be in.
        passage: { $ref: '#/components/schemas/PlacementPassage' }
        choices:
          type: array
          items: { $ref: '#/components/schemas/PlacementChoice' }
        audioUrl:
          type: string
          description: |
            Present only on a listening question that has a clip. A CDN address
            on a deployment with a public bucket, and the authenticated
            placement route otherwise. Nothing is rationed here either way: this
            test has no countdown and no one-play rule.

    PlacementPassage:
      type: object
      required: [id, bodyKo]
      description: |
        Present only when there is something to show. A listening question
        hangs off an AUDIO passage whose only text is the script, so it is
        absent there and the clip arrives through `audioUrl` instead — sending
        it anyway drew an empty box above the player.

        There is no transcript field, and that is deliberate: the script is the
        answer to the question being asked, and a field that cannot be sent
        cannot be leaked by a later edit.
      properties:
        id: { type: string, format: uuid }
        bodyKo: { type: string }
        images:
          type: array
          description: |
            A reading passage is sometimes a picture rather than prose — a
            notice, a timetable, an invitation. On those the picture *is* the
            reading material, so a passage with images and no text is still
            worth rendering.
          items: { $ref: '#/components/schemas/ExamImage' }

    PlacementChoice:
      type: object
      required: [id, ordinal, textKo]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1, maximum: 4 }
        textKo:
          type: string
          description: |
            Empty on a picture question. TOPIK II listening 1-3 and TOPIK I
            15-16 print four pictures and no words at all, and `images` carries
            them — without it those questions render as four blank buttons.
        images:
          type: array
          items: { $ref: '#/components/schemas/ExamImage' }

    PlacementSectionScore:
      type: object
      required: [correct, total]
      description: |
        Kept as a pair rather than a rate. R-06 makes the same point about
        topics: "sai 8 trên 11 lần gặp" is a fact, and a percentage is a claim
        about a sample whose size the reader cannot see.
      properties:
        correct: { type: integer }
        total: { type: integer }

    PlacementTopicMistake:
      type: object
      required: [topic, wrongCount, encounters]
      description: |
        Both halves, always — "sai 3 trên 4 lần gặp" (TCCN-342-1). The topic
        comes from the one already attached to the question under R-06; nothing
        here generates or infers one.
      properties:
        topic: { $ref: '#/components/schemas/Topic' }
        wrongCount: { type: integer }
        encounters: { type: integer }

    PlacementResult:
      type: object
      required: [sessionId, completedAt, suggestedLevel, note, listening, reading, topics, totalQuestions]
      properties:
        sessionId: { type: string, format: uuid }
        completedAt: { type: string, format: date-time }
        selfAssessedLevel:
          type: integer
          minimum: 1
          maximum: 6
          description: Absent when the learner chose "Tôi chưa biết".
        comparison:
          description: |
            Absent when there is nothing to compare against. The section is
            gone from the screen rather than rendered empty with a dash in it
            (TCCN-342-9).
          $ref: '#/components/schemas/PlacementComparison'
        suggestedLevel:
          type: integer
          minimum: 1
          maximum: 6
          description: |
            A level **to choose lessons with**, always shown with the word
            "gợi ý" beside it. Not an exam band, and not an `EstimatedBand`
            (TCCN-342-2, điều cấm số 5).
        note:
          type: string
          description: |
            The caveat that must appear beside the level. Required rather than
            optional for the same reason `EstimatedBand.disclaimer` is: a
            caveat a client may omit is one that gets omitted.
        listening: { $ref: '#/components/schemas/PlacementSectionScore' }
        reading: { $ref: '#/components/schemas/PlacementSectionScore' }
        weakerSection:
          description: |
            The skill to lean recommendations toward (TCCN-342-3). Absent when
            the two came out level — a difference read off a twelve-item sample
            that is not there would be noise reported as a finding.
          $ref: '#/components/schemas/PlacementSectionKind'
        topics:
          type: array
          items: { $ref: '#/components/schemas/PlacementTopicMistake' }
        totalQuestions: { type: integer }

    PlacementHistoryEntry:
      type: object
      required: [sessionId, completedAt, suggestedLevel, listening, reading]
      properties:
        sessionId: { type: string, format: uuid }
        completedAt: { type: string, format: date-time }
        suggestedLevel: { type: integer, minimum: 1, maximum: 6 }
        selfAssessedLevel: { type: integer, minimum: 1, maximum: 6 }
        listening: { $ref: '#/components/schemas/PlacementSectionScore' }
        reading: { $ref: '#/components/schemas/PlacementSectionScore' }

    MyPlacement:
      type: object
      required: [history]
      properties:
        currentLevel:
          type: integer
          minimum: 1
          maximum: 6
          description: |
            "Cấp độ đang dùng" — the level content is ordered by, changed only
            on an explicit tap (TCCN-342-6) and never lowered automatically
            (TCCN-342-8). Absent until the learner has chosen one.
        history:
          type: array
          description: Newest first. Old results stay readable after a retake (TCCN-344-1).
          items: { $ref: '#/components/schemas/PlacementHistoryEntry' }

    PlacementRecommendationKind:
      type: string
      description: |
        Which of R-32's four sources a row came from. Three have something
        behind them today; tình huống hội thoại (R-21) still has no table in
        this system, and TCCN-343-1 drops an empty source rather than padding
        it.
      enum: [PRACTICE_QUESTIONS, CARDS, SHADOWING_VIDEO]

    PlacementRecommendation:
      type: object
      required: [kind, topicId, topicName, count, wrongCount, encounters]
      properties:
        kind: { $ref: '#/components/schemas/PlacementRecommendationKind' }
        topicId: { type: string, format: uuid }
        topicName: { type: string }
        count:
          type: integer
          description: How much is behind the link — questions, or cards.
        wrongCount:
          type: integer
          description: |
            The numbers the reason points at (TCCN-343-2). The sentence itself
            is composed on the client, where the rest of this product's
            Vietnamese copy lives; what the server guarantees is that a reason
            cannot be written which the measurements do not support.
        encounters: { type: integer }

    PlacementRecommendations:
      type: object
      required: [suggestedLevel, items]
      properties:
        suggestedLevel: { type: integer, minimum: 1, maximum: 6 }
        items:
          type: array
          description: |
            Empty is a real answer, and the screen shows TCCN-343-5's empty
            state — "Chưa có nội dung ở cấp độ này" plus one thing that can be
            done right now — rather than an empty list or off-level filler.
          items: { $ref: '#/components/schemas/PlacementRecommendation' }

    ExamStatus:
      type: string
      enum: [DRAFT, PUBLISHED, RETIRED]

    ExamOrigin:
      type: string
      enum: [OFFICIAL, AI_GENERATED]

    QuestionType:
      type: string
      enum: [MCQ, FILL_BLANK, ESSAY]

    BlueprintSection:
      type: object
      required: [kind, sitting, ordinal, questionCount, timeLimitSeconds, maxScore]
      properties:
        kind: { $ref: '#/components/schemas/SectionKind' }
        sitting:
          type: integer
          description: |
            TOPIK II is sat over two sessions — Nghe and Viết in the first, Đọc
            in the second — and each section keeps its own clock. One timer over
            all 300 points would be a different exam (TCCN-302-3).
        ordinal: { type: integer }
        questionCount: { type: integer }
        timeLimitSeconds: { type: integer }
        maxScore: { type: integer }

    Blueprint:
      type: object
      required: [version, level, totalScore, sections]
      properties:
        version: { type: string }
        level: { $ref: '#/components/schemas/ExamLevel' }
        totalScore: { type: integer }
        effectiveFrom: { type: string, format: date }
        verifiedAt:
          type: [string, 'null']
          format: date
          description: |
            When this layout was last checked against the official TOPIK
            publication. Null means it is the BA document's stated structure and
            nobody has reconciled it yet (GĐ-1).
        sections:
          type: array
          items: { $ref: '#/components/schemas/BlueprintSection' }

    AdminExamSection:
      type: object
      required: [id, kind, sitting, ordinal, questionCount, timeLimitSeconds, maxScore, authoredCount]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SectionKind' }
        sitting: { type: integer }
        ordinal: { type: integer }
        questionCount:
          type: integer
          description: |
            Copied from the blueprint when the paper was created and never
            re-read, so a later blueprint revision cannot restructure a paper
            people have already sat.
        timeLimitSeconds: { type: integer }
        maxScore: { type: integer }
        authoredCount:
          type: integer
          description: How many questions actually exist in this section so far.

    AdminExamListItem:
      type: object
      required: [id, code, title, level, status, origin, blueprintVersion, questionCount, examReady, missingSections]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        level: { $ref: '#/components/schemas/ExamLevel' }
        status: { $ref: '#/components/schemas/ExamStatus' }
        origin: { $ref: '#/components/schemas/ExamOrigin' }
        blueprintVersion: { type: string }
        year: { type: [integer, 'null'] }
        questionCount: { type: integer }
        examReady:
          type: boolean
          description: |
            False when a section in the blueprint has no questions. Such a paper
            may still be published for Luyện tập, but is marked as unusable for
            Thi thử wherever it is listed — before anyone starts it, not after
            (TCCN-302-4).
        missingSections:
          type: array
          items: { $ref: '#/components/schemas/SectionKind' }
        sourceName:
          type: string
          description: |
            The import batch this paper came from. "Free to download" is not
            "licensed for a paid product", and a whole source has to be
            withdrawable as a unit.

    AdminExamDetail:
      allOf:
        - $ref: '#/components/schemas/AdminExamListItem'
        - type: object
          required: [sections, blueprint]
          properties:
            sections:
              type: array
              items: { $ref: '#/components/schemas/AdminExamSection' }
            blueprint: { $ref: '#/components/schemas/Blueprint' }
            sourceUrl: { type: string }
            licenseNote: { type: string }
            publishedAt: { type: [string, 'null'], format: date-time }

    PublishReport:
      type: object
      required: [examCode, published, blockers, warnings, unassignedDifficultyCount]
      properties:
        examCode: { type: string }
        published:
          type: boolean
          description: False when a blocker stood, or when this was a dry run.
        blockers:
          type: array
          description: |
            Each refuses the publish, and each names the question it is about —
            "3 câu hỏng" sends an author back through fifty questions to find
            which three.
          items: { type: string }
        warnings:
          type: array
          description: Reported, never blocking.
          items: { type: string }
        unassignedDifficultyCount:
          type: integer
          description: |
            Questions with no hand-assigned difficulty. A count to look at
            rather than a reason to stop (TCCN-303-3).

    LayerStatus:
      type: object
      description: |
        Which of the five layers exist. Absent is absent — the review screen
        hides a layer with no content rather than heading an empty box
        (TCCN-301-3).
      required: [layer2, layer3Written, layer3Required, layer4, layer5, translated]
      properties:
        layer2: { type: boolean }
        layer3Written:
          type: integer
          description: Distractors that have their own explanation.
        layer3Required:
          type: integer
          description: Distractors on this question.
        layer4: { type: boolean }
        layer5: { type: boolean }
        translated:
          type: boolean
          description: Stem and every choice carry Vietnamese (YC-121).

    AdminQuestionRow:
      type: object
      required: [id, ordinal, type, stemKo, layerStatus, choiceCount, correctChoiceCount, attemptedCount]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer }
        displayOrdinal:
          type: integer
          description: |
            The number printed on the paper where it differs from `ordinal` —
            TOPIK II Reading restarts at 1 after Listening and Writing.
        sectionKind: { $ref: '#/components/schemas/SectionKind' }
        type: { $ref: '#/components/schemas/QuestionType' }
        stemKo: { type: string }
        layerStatus: { $ref: '#/components/schemas/LayerStatus' }
        difficultyManual: { type: [integer, 'null'], minimum: 1, maximum: 6 }
        choiceCount: { type: integer }
        correctChoiceCount: { type: integer }
        attemptedCount:
          type: integer
          description: |
            Submitted attempts containing this question. Zero means the answer
            key is still free to change (TCCN-301-9).

    AdminChoice:
      type: object
      required: [ordinal, textKo, textVi, isCorrect]
      properties:
        ordinal: { type: integer, minimum: 1, maximum: 4 }
        textKo: { type: string }
        textVi:
          type: string
          description: |
            YC-121. Authored with the exam, never machine-translated at request
            time: a learner who cannot read the choice cannot read an
            explanation about that choice either.
        isCorrect: { type: boolean }
        whyWrongKo:
          type: [string, 'null']
          description: |
            Layer 3, per choice. Three distractors get three boxes — an
            explanation shared across all of them cannot say anything about any
            one of them (TCCN-301-2).
        whyWrongVi: { type: [string, 'null'] }

    AdminEvidence:
      type: object
      description: |
        Layer 4. A reading span is character offsets into the passage; a
        listening span is milliseconds into the clip. One of the two must be
        present — evidence that does not locate itself is not evidence.
      required: [quoteKo, quoteVi]
      properties:
        id: { type: string, format: uuid }
        passageId: { type: [string, 'null'], format: uuid }
        charStart: { type: [integer, 'null'], minimum: 0 }
        charEnd: { type: [integer, 'null'], minimum: 0 }
        audioStartMs: { type: [integer, 'null'], minimum: 0 }
        audioEndMs: { type: [integer, 'null'], minimum: 0 }
        quoteKo:
          type: string
          description: |
            The text the offsets pointed at when they were saved, so an edit to
            the passage can be detected as having moved the span rather than
            silently re-aiming it (TCCN-301-4).
        quoteVi: { type: string }

    AdminQuestionTopic:
      type: object
      required: [topicId, name, category, note]
      properties:
        topicId: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: '#/components/schemas/TopicCategory' }
        note: { type: string }

    AdminPassage:
      type: object
      required: [id, kind]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/SectionKind' }
        textKo: { type: [string, 'null'] }
        textVi: { type: [string, 'null'] }
        audioAssetId: { type: [string, 'null'], format: uuid }
        audioDurationMs: { type: [integer, 'null'] }

    AdminQuestion:
      type: object
      required: [id, examId, ordinal, type, stemKo, stemVi, maxScore, choices, topics, evidence, attemptedCount, layerStatus]
      properties:
        id: { type: string, format: uuid }
        examId: { type: string, format: uuid }
        sectionKind: { $ref: '#/components/schemas/SectionKind' }
        ordinal: { type: integer }
        displayOrdinal: { type: integer }
        type: { $ref: '#/components/schemas/QuestionType' }
        passageId: { type: [string, 'null'], format: uuid }
        stemKo: { type: string }
        stemVi: { type: string }
        maxScore: { type: integer }
        explanationCorrectKo:
          type: [string, 'null']
          description: |
            Layer 2 — why the right answer is right. Authored for every
            question, including ones answered correctly: right by elimination is
            a wrong answer that has not happened yet (R-07, YC-112).

            Null, never `""`. An empty string renders on the learner's review
            screen as a layer heading with nothing under it, which reads as "the
            author had nothing to say" rather than "this is not written yet"
            (TCCN-301-3).
        explanationCorrectVi: { type: [string, 'null'] }
        explanationWrongGenericKo:
          type: [string, 'null']
          description: |
            The layer-3 fallback for an author who wrote one shared note. It
            exists because imported papers have it; the editor does not offer it
            as a way to avoid writing three.
        explanationWrongGenericVi: { type: [string, 'null'] }
        markingGuideKo:
          type: [string, 'null']
          description: |
            The examiner's marking reference for an ESSAY task — what a
            full-mark answer has to contain.

            Not a sixth explanation layer. It is given to the grader and never
            to a learner: no learner-facing response carries it, and the
            contract's leak test names the field so one added later fails the
            build. Only an ESSAY may carry it; câu 51/52 keep the equivalent
            per blank.
        difficultyManual:
          type: [integer, 'null']
          minimum: 1
          maximum: 6
          description: |
            YC-303, assigned by hand while authoring. A TOPIK band, 1-6:
            widened from 1-5 in migration 00021 because R-32 addresses
            difficulty in bands ("độ khó ở TOPIK4", TCCN-341-7) and the
            placement test is this value's only reader. Never rendered to a
            learner — no label, no filter, no sort (TCCN-303-2).
        difficultyObserved:
          type: [number, 'null']
          description: |
            Derived from real attempt data. Read-only, and kept apart from the
            manual value on purpose: ver1.0 uses only the manual one, and
            collapsing the two would mean changing the schema again later.
        choices:
          type: array
          items: { $ref: '#/components/schemas/AdminChoice' }
        topics:
          type: array
          items: { $ref: '#/components/schemas/AdminQuestionTopic' }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/AdminEvidence' }
        attemptedCount: { type: integer }
        supersededByQuestionId: { type: [string, 'null'], format: uuid }
        layerStatus: { $ref: '#/components/schemas/LayerStatus' }

    SaveQuestionRequest:
      type: object
      required: [stemKo, choices]
      properties:
        stemKo: { type: string }
        stemVi: { type: string }
        explanationCorrectKo: { type: [string, 'null'] }
        explanationCorrectVi: { type: [string, 'null'] }
        explanationWrongGenericKo: { type: [string, 'null'] }
        explanationWrongGenericVi: { type: [string, 'null'] }
        markingGuideKo:
          type: [string, 'null']
          description: |
            The examiner's marking reference for an ESSAY task — what a
            full-mark answer has to contain.

            Not a sixth explanation layer. It is given to the grader and never
            to a learner: no learner-facing response carries it, and the
            contract's leak test names the field so one added later fails the
            build. Only an ESSAY may carry it; câu 51/52 keep the equivalent
            per blank.
        difficultyManual: { type: [integer, 'null'], minimum: 1, maximum: 6 }
        choices:
          type: array
          items: { $ref: '#/components/schemas/AdminChoice' }
        topicIds:
          type: array
          items: { type: string, format: uuid }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/AdminEvidence' }

    AnswerLockedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            attemptedCount:
              type: integer
              description: |
                Submitted attempts already carrying this question. Changing the
                key would rewrite every one of their scores and every
                denominator in the error log — "sai 8 trên 11 lần gặp" would
                change meaning with nobody, including the person who pressed
                save, being told (TCCN-301-8).
            questionOrdinal: { type: integer }

    ImportRequest:
      type: object
      required: [bundle]
      properties:
        bundle:
          type: object
          additionalProperties: true
          description: The exam bundle, in the format `cmd/importer` accepts.

    ImportIssue:
      type: object
      required: [where, message]
      properties:
        where:
          type: string
          description: |
            Where in the bundle, e.g. `questions[14].choices`. Not a line
            number: the gate validates the parsed bundle, and by then the line
            it came from is gone.
        message: { type: string }

    ImportReport:
      type: object
      required: [dryRun, examCode, ok, issues]
      properties:
        dryRun: { type: boolean }
        examCode: { type: string }
        ok:
          type: boolean
          description: False when the gate refused; `issues` says why.
        examId: { type: [string, 'null'], format: uuid }
        batchId: { type: [string, 'null'], format: uuid }
        passages: { type: integer }
        questions: { type: integer }
        choices: { type: integer }
        topics: { type: integer }
        topicsNew:
          type: integer
          description: |
            Topics this bundle added to the catalogue. Worth seeing on its own:
            a bundle that invents thirty new topics has probably spelled
            existing ones differently, which is what splits a weakness row in
            two (R-06).
        issues:
          type: array
          items: { $ref: '#/components/schemas/ImportIssue' }
        translationCoverage:
          type: number
          description: |
            Reported, never blocking. YC-121 is blunt about why it matters, but
            an untranslated paper is still a paper.

    # ── nhại theo (R-19) ──────────────────────────────────────────────────

    ShadowVideoStatus:
      type: string
      enum: [DRAFT, IN_REVIEW, PUBLISHED, RETIRED]

    ShadowApprovalVerdict:
      type: string
      description: |
        Three values rather than a boolean, because "chưa nghe" and "chưa đạt"
        send the author to different places: one needs an ear, the other needs
        a fix.
      enum: [UNREVIEWED, APPROVED, REJECTED]

    ShadowPartOfSpeech:
      type: string
      enum: [NOUN, VERB, ADJECTIVE, ADVERB, GRAMMAR_PATTERN]

    ShadowProgress:
      type: object
      required: [lineCount, practisedCount, practisedLineIds]
      properties:
        lineCount: { type: integer }
        practisedCount: { type: integer }
        practisedLineIds:
          type: array
          description: Never null, so an untouched video serialises as `[]` (R-13).
          items: { type: string, format: uuid }

    ShadowVideoListItem:
      type: object
      required: [id, title, durationMs, lineCount, wordCount, practisedCount]
      description: |
        Carries no level, deliberately. The list is ordered by level on the
        server and the screen never shows one; a field on the wire is one
        refactor away from a screen, and this is the screen TCCN-345-3's "không
        khoá nội dung" is about.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        durationMs: { type: integer }
        lineCount: { type: integer }
        wordCount: { type: integer }
        practisedCount:
          type: integer
          description: |
            With lineCount this is the whole progress pill. `chưa luyện` is
            zero and `18 / 18 câu` is equality — both composed on the client,
            where the rest of this product's Vietnamese lives.

    # ── chép chính tả (R-36) ───────────────────────────────────────────────

    DictationSetListItem:
      type: object
      required: [id, title, durationMs, itemCount, wordCount, correctCount]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        durationMs:
          type: integer
          description: Every sentence's audio added up, for "3:20" on the card.
        itemCount: { type: integer }
        wordCount:
          type: integer
          description: Entries in this set's own dictionary.
        correctCount:
          type: integer
          description: |
            TCCN-427-1's numerator: sentences whose BEST result was đúng or
            gần đúng. A gần đúng counts — the learner heard every character.

    DictationSetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DictationSetListItem' }

    DictationItem:
      type: object
      required: [id, ordinal, audioUrl, durationMs]
      description: |
        One sentence to type. **Note what is not here.**

        No `textKo`: showing the sentence is the exercise gone. No `textVi`
        either — TCCN-421-6 is blunt that a translation is worse, because the
        learner reads backwards from the meaning and never listens. No
        glossary and no anchors: the set dictionary names the words in the
        sentence, and a devtools panel is not a difficulty setting.

        No syllable or character count either, and that one is easy to add by
        accident. TCCN-421-1 enumerates what the screen may show — "nút phát,
        ô gõ, và câu số mấy trên tổng số" — and a length hint is not on it.
        `durationMs` is on it only because a player cannot draw a progress bar
        without one, and 1.8 seconds tells a learner far less than "12
        characters" would.

        internal/api/contract/leak_test.go asserts all of this over this very
        schema, so the guarantee survives someone reusing a studio type.
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1 }
        audioUrl:
          type: string
          description: |
            A public CDN URL an `<audio>` element reads directly. That is what
            makes TCCN-422-1's unlimited replay free — the tenth play is a
            browser cache hit and reaches no server — and what keeps the
            0.5–2 speed control a client-side property with no server surface.
        durationMs: { type: integer }
        bestGrade:
          $ref: '#/components/schemas/DictationGrade'
          description: |
            Absent means chưa làm. Present is the BEST result this learner has
            had on this sentence, not the most recent (TCCN-425-2).

    DictationGrade:
      type: string
      enum: [CORRECT, CLOSE, INCORRECT]
      description: |
        Ba mức, không phải hai. CLOSE is "chỉ sai chỗ tách chữ" — every
        syllable right and in the right order, only the spacing wrong — and it
        counts as done everywhere progress is counted (TCCN-423-2, 427-1).

    DictationProgress:
      type: object
      required: [itemCount, correctCount]
      properties:
        itemCount: { type: integer }
        correctCount: { type: integer }

    DictationSetDetail:
      type: object
      required: [id, title, items, progress]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/DictationItem' }
        progress: { $ref: '#/components/schemas/DictationProgress' }
        resumeItemId:
          type: string
          format: uuid
          description: |
            Where the learner left off (TCCN-425-3). Absent on a set nobody has
            opened, which the client reads as "start at the first sentence".

            Not derivable from the results: a learner who skipped câu 7 and
            stopped at câu 12 has no row for either, so "first sentence with no
            result" would send them back to 7.

    DictationAttemptRequest:
      type: object
      required: [typed]
      properties:
        typed:
          type: string
          description: |
            Exactly what the learner typed. Normalisation is the server's job
            and is part of the specification (TCCN-423-3) — NFC first, then
            case, punctuation and spacing — so a client that "helpfully" tidies
            this first changes the grade.

    DictationChar:
      type: object
      required: [text, state]
      description: One character of one side, with what the comparison says about it.
      properties:
        text:
          type: string
          description: Exactly one code point of the NFC form of its side.
        state:
          type: string
          enum: [SAME, MISSING, EXTRA, CHANGED]
          description: |
            Four states rather than a boolean, because TCCN-424-1 asks for
            three distinct facts by name — "âm tiết nào thiếu, âm tiết nào
            thừa, âm tiết nào gõ khác" — and a screen rendering all three the
            same way has answered none of them.

            SAME also covers every character the comparison never looked at:
            spaces and punctuation, which normalisation drops. The one grade
            where spacing genuinely differs is CLOSE, and TCCN-423-2 forbids
            error marks there — so there is no case where a dropped character
            should be marked.
        jamo:
          $ref: '#/components/schemas/DictationJamoDiff'

    DictationJamoDiff:
      type: object
      description: |
        Which parts of a Hangul syllable moved, on a CHANGED character whose
        two sides are both syllables. 예 against 에 is one shared initial and a
        moved medial: ㅖ → ㅔ. Absent parts matched.

        This is the difference between telling a learner "you heard the
        consonant, the vowel is what to listen for" and telling them "wrong".
      properties:
        initial: { $ref: '#/components/schemas/DictationJamoPair' }
        medial: { $ref: '#/components/schemas/DictationJamoPair' }
        final: { $ref: '#/components/schemas/DictationJamoPair' }

    DictationJamoPair:
      type: object
      required: [expected, typed]
      properties:
        expected:
          type: string
          description: |
            A compatibility jamo (U+3131…U+3163) — ㅖ, not the conjoining
            U+1100-block form, which renders as a broken half-glyph alone.
        typed: { type: string }

    DictationAttemptResult:
      type: object
      required: [grade, textKo, expected, typed, suggestions, progress]
      description: |
        The only response that carries the Korean, and it carries it because
        the learner has now answered.
      properties:
        grade: { $ref: '#/components/schemas/DictationGrade' }
        textKo:
          type: string
          description: The real sentence, revealed now and nowhere earlier.
        textVi:
          type: string
          description: |
            Shown after grading, never before (TCCN-424-2). Absent while a set
            still has sentences nobody has translated.
        expected:
          type: array
          items: { $ref: '#/components/schemas/DictationChar' }
          description: |
            The real sentence, marked. Always the full string even when nothing
            is wrong, so the client walks one array on every path and grows no
            second render branch for the good cases (R-13).
        typed:
          type: array
          items: { $ref: '#/components/schemas/DictationChar' }
        suggestions:
          type: array
          items: { $ref: '#/components/schemas/DictationCardSuggestion' }
          description: |
            Dictionary words the learner mistyped, offered as cards (YC-426).
            `[]` on anything but a wrong answer — a gần đúng means every
            syllable was right and only the spacing moved, so there is no
            mistyped word to offer.
        progress: { $ref: '#/components/schemas/DictationProgress' }

    DictationCardSuggestion:
      type: object
      required: [entryId, headwordKo, meaningVi]
      description: |
        A word from this set's dictionary that the learner got wrong.

        An OFFER, never a save. "Chỉ gợi ý, không tự lưu — người học quyết"
        (TCCN-426-1). The learner saves it with `POST /cards`, which
        deduplicates on its own: a word already in the collection comes back
        with `alreadyExisted` and the existing card rather than a second one
        (TCCN-426-3).

        Only words the dictionary already holds are ever offered
        (TCCN-426-2) — nothing invents an entry from the place a learner typed
        wrong, because R-17 makes the dictionary hand-authored content whose
        meaning is true in this context.
      properties:
        entryId: { type: string, format: uuid }
        headwordKo: { type: string }
        readingLatin: { type: string }
        meaningVi:
          type: string
          description: |
            The general meaning, and the one that belongs on the card: a card is
            met three weeks later with this sentence nowhere in sight.
        contextMeaningVi:
          type: string
          description: |
            "Nghĩa trong bộ này" — for the offer itself, where the learner is
            still inside the sentence that makes it true. Not what goes on the
            card.

    DictationSkipResult:
      type: object
      required: [progress]
      properties:
        progress: { $ref: '#/components/schemas/DictationProgress' }
        resumeItemId:
          type: string
          format: uuid
          description: The sentence the learner lands on, so a reload agrees with the screen.

    # ── studio: chép chính tả ──────────────────────────────────────────────

    AdminDictationApproval:
      type: object
      required: [verdict, stale]
      properties:
        verdict: { type: string, enum: [UNREVIEWED, APPROVED, REJECTED] }
        note:
          type: string
          description: Required on REJECTED — a sentence nobody can fix otherwise.
        reviewedAt: { type: string, format: date-time }
        reviewedByName: { type: string }
        stale:
          type: boolean
          description: |
            The verdict was made about an earlier revision: the Korean or the
            audio has changed underneath it. Computed on the server so the
            client never compares revisions itself, and counted as unreviewed
            by the gate. A stale verdict looks exactly like a fresh one unless
            somebody does this comparison.

    AdminDictationItem:
      type: object
      required: [id, ordinal, textKo, textVi, audioUrl, durationMs, source, revision, approval]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1 }
        textKo: { type: string }
        textVi: { type: string }
        audioUrl:
          type: string
          description: |
            The reviewer has to HEAR it — that is the entire job this screen
            exists for, and the one thing cmd/dictation-import cannot do.
        durationMs: { type: integer }
        source: { type: string, enum: [UPLOAD, SYNTHETIC] }
        revision: { type: integer, minimum: 1 }
        approval: { $ref: '#/components/schemas/AdminDictationApproval' }

    AdminDictationOccurrence:
      type: object
      required: [itemId, charStart, charEnd, surfaceKo]
      properties:
        itemId: { type: string, format: uuid }
        charStart: { type: integer, minimum: 0 }
        charEnd: { type: integer, minimum: 1 }
        surfaceKo: { type: string }

    AdminDictationGlossaryEntry:
      type: object
      required: [id, headwordKo, readingLatin, partOfSpeech, meaningVi, contextMeaningVi, contextSettled, occurrences]
      properties:
        id: { type: string, format: uuid }
        headwordKo: { type: string }
        readingLatin: { type: string }
        partOfSpeech:
          type: string
          enum: [NOUN, VERB, ADJECTIVE, ADVERB, GRAMMAR_PATTERN]
        meaningVi: { type: string }
        contextMeaningVi: { type: string }
        contextSettled: { type: boolean }
        occurrences:
          type: array
          items: { $ref: '#/components/schemas/AdminDictationOccurrence' }

    AdminDictationReviewSummary:
      type: object
      required: [total, approved, rejected, unreviewed]
      description: |
        `unreviewed` includes STALE approvals, so this counter and the publish
        gate cannot disagree about what still needs an ear.
      properties:
        total: { type: integer }
        approved: { type: integer }
        rejected: { type: integer }
        unreviewed: { type: integer }

    AdminDictationSetRow:
      type: object
      required: [id, title, level, voice, voiceKind, status, review]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        level: { type: integer, minimum: 1, maximum: 6 }
        voice: { type: string }
        voiceKind: { type: string, enum: [HUMAN, SYNTHETIC] }
        status: { type: string, enum: [DRAFT, IN_REVIEW, PUBLISHED, RETIRED] }
        publishedAt: { type: string, format: date-time }
        review: { $ref: '#/components/schemas/AdminDictationReviewSummary' }

    AdminDictationSetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminDictationSetRow' }

    AdminDictationSetDetail:
      type: object
      required: [id, title, level, voice, voiceKind, status, items, glossary, review]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        level: { type: integer, minimum: 1, maximum: 6 }
        voice: { type: string }
        voiceKind: { type: string, enum: [HUMAN, SYNTHETIC] }
        status: { type: string, enum: [DRAFT, IN_REVIEW, PUBLISHED, RETIRED] }
        publishedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminDictationItem' }
        glossary:
          type: array
          items: { $ref: '#/components/schemas/AdminDictationGlossaryEntry' }
        review: { $ref: '#/components/schemas/AdminDictationReviewSummary' }

    SaveDictationSetRequest:
      type: object
      required: [title, level]
      description: |
        The metadata, and only the metadata — sentences and the dictionary come
        from cmd/dictation-import and are not editable through the API.
      properties:
        title: { type: string, minLength: 1 }
        level: { type: integer, minimum: 1, maximum: 6 }
        voice: { type: string }
        voiceKind: { type: string, enum: [HUMAN, SYNTHETIC] }

    AdminDictationApprovalRequest:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string, enum: [UNREVIEWED, APPROVED, REJECTED] }
        note: { type: string }

    AdminDictationPublishReport:
      type: object
      required: [published, blockers, warnings]
      properties:
        published: { type: boolean }
        blockers:
          type: array
          items: { type: string }
          description: Each names the sentence it is about.
        warnings:
          type: array
          items: { type: string }

    ShadowVideoList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShadowVideoListItem' }

    ShadowTerm:
      type: object
      required: [entryId, charStart, charEnd]
      description: |
        Where in this line a dictionary word sits.

        Offsets are half-open [charStart, charEnd) and counted in **Unicode
        code points**. The client must slice with `Array.from(textKo)`, not
        `String.slice`, which counts UTF-16 code units — the two agree for
        every Hangul syllable and stop agreeing the moment a line carries an
        astral character.

        They are authored rather than searched for. Korean is agglutinative:
        접수 appears in a line as 접수는 and 예약 as 예약하려고, so a substring
        search misses some occurrences, swallows particles on others, and
        matches a headword sitting inside an unrelated word. That failure looks
        deliberate on screen, so nobody reports it.

        entryId rather than an inlined meaning: a word in six lines has one
        entry and six anchors, so the detail a tap opens cannot drift into six
        near-copies.
      properties:
        entryId: { type: string, format: uuid }
        charStart: { type: integer, minimum: 0 }
        charEnd: { type: integer, minimum: 1 }

    ShadowLine:
      type: object
      required: [id, ordinal, startMs, endMs, textKo, textVi, terms, practised]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1 }
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 1 }
        textKo: { type: string }
        textVi:
          type: string
          description: |
            Required, and the opposite of PlacementQuestion's rule. There a
            gloss would let a learner read their way to a level measuring
            someone who will not exist on exam day. Here the gloss under the
            current line **is** the screen: shadowing a sentence you do not
            understand is parroting (TCCN-352-9). The publish gate is what
            makes "required" true.
        speaker:
          type: string
          description: 민수 / 지수. Absent when the material has no named speakers.
        terms:
          type: array
          items: { $ref: '#/components/schemas/ShadowTerm' }
        practised: { type: boolean }

    ShadowGlossaryEntry:
      type: object
      required: [id, headwordKo, partOfSpeech, meaningVi, contextMeaningVi]
      properties:
        id: { type: string, format: uuid }
        headwordKo: { type: string }
        readingLatin: { type: string }
        partOfSpeech: { $ref: '#/components/schemas/ShadowPartOfSpeech' }
        meaningVi: { type: string }
        contextMeaningVi:
          type: string
          description: |
            Required. A published video cannot hold an unsettled entry — the
            publish gate and a database CHECK both refuse it — so this is the
            schema carrying that guarantee out to the client rather than
            repeating the check (TCCN-353-3).

    ShadowVideoDetail:
      type: object
      required: [id, title, durationMs, playbackUrl, lines, glossary, progress]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        durationMs: { type: integer }
        playbackUrl:
          type: string
          description: |
            An absolute public URL on the Cloudflare R2 custom domain, read
            straight by a `<video>` element with no credential.

            Deliberately unlike an attempt's audio, which is one learner's
            frozen paper under R-01's single-play rule and therefore goes
            through an authenticated fetch and an object URL. Catalogue content
            belongs to nobody's attempt, so that dance buys nothing and costs
            native seeking and playbackRate — which this whole feature is built
            on. Requires the origin to serve `Accept-Ranges: bytes`; without
            range requests `currentTime` cannot seek and the feature is inert.
        lines:
          type: array
          description: |
            Named lines, not transcript, and the word is chosen. "Transcript"
            in this product means passages.transcript_ko — the script of a
            listening question, which is the answer to that question. A
            shadowing line answers nothing, and withholding the Korean would
            leave a learner shadowing a sentence they cannot read.
          items: { $ref: '#/components/schemas/ShadowLine' }
        glossary:
          type: array
          items: { $ref: '#/components/schemas/ShadowGlossaryEntry' }
        progress: { $ref: '#/components/schemas/ShadowProgress' }

    ShadowCardListItem:
      type: object
      required: [cardId, front, videoId, videoTitle, lineId, lineTextKo, startMs, endMs]
      properties:
        cardId: { type: string, format: uuid }
        front: { type: string }
        back: { type: string }
        videoId: { type: string, format: uuid }
        videoTitle: { type: string }
        lineId: { type: string, format: uuid }
        lineTextKo: { type: string }
        startMs: { type: integer }
        endMs: { type: integer }

    ShadowCardList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShadowCardListItem' }

    AdminShadowAsset:
      type: object
      required: [assetId, playbackUrl, objectKey, byteSize, mimeType, durationMs]
      properties:
        assetId: { type: string, format: uuid }
        playbackUrl: { type: string }
        objectKey: { type: string }
        byteSize: { type: integer, format: int64 }
        mimeType: { type: string }
        durationMs: { type: integer }

    AdminShadowApproval:
      type: object
      required: [verdict]
      properties:
        verdict: { $ref: '#/components/schemas/ShadowApprovalVerdict' }
        note:
          type: string
          description: Required when the verdict is REJECTED (TCCN-354-2).
        reviewedAt: { type: string, format: date-time }
        reviewedByName: { type: string }
        stale:
          type: boolean
          description: |
            The verdict was made about an earlier revision of this line — the
            timing or the Korean has changed underneath it. The gate counts a
            stale verdict as unreviewed (TCCN-354-4). Computed by the server so
            the client never compares revisions itself.

    AdminShadowLine:
      type: object
      required: [id, ordinal, startMs, endMs, textKo, textVi, speaker, revision, approval]
      properties:
        id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1 }
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 1 }
        textKo: { type: string }
        textVi: { type: string }
        speaker: { type: string }
        revision:
          type: integer
          description: Bumped whenever the timing, the Korean, or the video asset changes.
        approval: { $ref: '#/components/schemas/AdminShadowApproval' }

    AdminShadowOccurrence:
      type: object
      required: [lineId, charStart, charEnd, surfaceKo]
      properties:
        lineId: { type: string, format: uuid }
        charStart: { type: integer, minimum: 0 }
        charEnd: { type: integer, minimum: 1 }
        surfaceKo:
          type: string
          description: |
            The inflected characters actually present — 접수, not 접수는.
            Redundant against the line text by design: it is what catches an
            anchor whose offsets have drifted after the line was re-typed
            (TCCN-353-4), and what an author reads in a diff.

    AdminShadowGlossaryEntry:
      type: object
      required: [id, headwordKo, partOfSpeech, meaningVi, contextMeaningVi, contextSettled, occurrences]
      properties:
        id: { type: string, format: uuid }
        headwordKo: { type: string }
        readingLatin: { type: string }
        partOfSpeech: { $ref: '#/components/schemas/ShadowPartOfSpeech' }
        meaningVi: { type: string }
        contextMeaningVi: { type: string }
        contextSettled: { type: boolean }
        occurrences:
          type: array
          items: { $ref: '#/components/schemas/AdminShadowOccurrence' }

    ShadowReviewSummary:
      type: object
      required: [total, approved, rejected, unreviewed]
      properties:
        total: { type: integer }
        approved: { type: integer }
        rejected: { type: integer }
        unreviewed:
          type: integer
          description: Includes lines whose verdict has gone stale.

    AdminShadowVideoRow:
      type: object
      required: [id, title, level, status, lineCount, wordCount, review]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        level: { type: integer, minimum: 1, maximum: 6 }
        status: { $ref: '#/components/schemas/ShadowVideoStatus' }
        publishedAt:
          type: string
          format: date-time
          description: |
            Absent on a video that has never gone out — which is the one thing
            that decides whether it can be deleted or only retired, and it is
            not derivable from `status`, because a RETIRED video is not
            published now and still must not be deleted. Carried on the row
            rather than looked up per video so the list can label its own
            buttons. AdminDictationSetRow carries it for the same reason.
        durationMs: { type: integer }
        lineCount: { type: integer }
        wordCount: { type: integer }
        review: { $ref: '#/components/schemas/ShadowReviewSummary' }

    AdminShadowVideoList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminShadowVideoRow' }

    AdminShadowVideoDetail:
      type: object
      required: [id, title, level, status, voice, voiceKind, topics, lines, glossary, review]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        level: { type: integer, minimum: 1, maximum: 6 }
        status: { $ref: '#/components/schemas/ShadowVideoStatus' }
        voice: { type: string }
        voiceKind: { type: string, enum: [HUMAN, SYNTHETIC] }
        publishedAt: { type: string, format: date-time }
        asset: { $ref: '#/components/schemas/AdminShadowAsset' }
        topics:
          type: array
          items: { $ref: '#/components/schemas/Topic' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/AdminShadowLine' }
        glossary:
          type: array
          items: { $ref: '#/components/schemas/AdminShadowGlossaryEntry' }
        review: { $ref: '#/components/schemas/ShadowReviewSummary' }

    CreateShadowVideoRequest:
      type: object
      required: [title, level]
      properties:
        title: { type: string, minLength: 1 }
        level: { type: integer, minimum: 1, maximum: 6 }

    SaveShadowVideoRequest:
      type: object
      required: [title, level]
      properties:
        title: { type: string, minLength: 1 }
        level: { type: integer, minimum: 1, maximum: 6 }
        voice: { type: string }
        voiceKind: { type: string, enum: [HUMAN, SYNTHETIC] }
        topicIds:
          type: array
          items: { type: string, format: uuid }

    SaveShadowLineInput:
      type: object
      required: [startMs, endMs, textKo]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Omitted for a new line. Present to keep an existing line's identity
            — and with it its approval, when nothing about it changed.
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 1 }
        textKo: { type: string, minLength: 1 }
        textVi: { type: string }
        speaker: { type: string }

    SaveShadowLinesRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          description: Ordinals come from this array's order, not from the client.
          items: { $ref: '#/components/schemas/SaveShadowLineInput' }

    SaveShadowGlossaryEntryInput:
      type: object
      required: [headwordKo, partOfSpeech, meaningVi]
      properties:
        id: { type: string, format: uuid }
        headwordKo: { type: string, minLength: 1 }
        readingLatin: { type: string }
        partOfSpeech: { $ref: '#/components/schemas/ShadowPartOfSpeech' }
        meaningVi: { type: string, minLength: 1 }
        contextMeaningVi: { type: string }
        contextSettled: { type: boolean }
        occurrences:
          type: array
          items: { $ref: '#/components/schemas/AdminShadowOccurrence' }

    SaveShadowGlossaryRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/SaveShadowGlossaryEntryInput' }

    SetShadowLineApprovalRequest:
      type: object
      required: [verdict]
      properties:
        verdict: { $ref: '#/components/schemas/ShadowApprovalVerdict' }
        note: { type: string }

    CreateShadowUploadTargetRequest:
      type: object
      required: [fileName, mimeType, byteSize]
      properties:
        fileName: { type: string, minLength: 1 }
        mimeType: { type: string }
        byteSize: { type: integer, format: int64, minimum: 1 }
        sha256:
          type: string
          description: |
            Lower-case hex of the file's SHA-256, when the client computed one.
            Signed into the PUT so R2 verifies the digest on write and rejects
            a mismatch — which is a stronger integrity check than a
            self-reported number, and saves the server re-reading 30 MB to
            measure it.

    ShadowUploadTarget:
      type: object
      required: [url, method, headers, objectKey, expiresAt]
      properties:
        url: { type: string }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          additionalProperties: { type: string }
          description: |
            Send these verbatim and add nothing. They are the headers that were
            signed; altering or omitting one is a signature mismatch, and
            adding an unsigned one is fine but pointless. Opaque on purpose —
            the dashboard should not learn R2 header names.
        objectKey: { type: string }
        expiresAt: { type: string, format: date-time }

    ConfirmShadowUploadRequest:
      type: object
      required: [objectKey, durationMs]
      properties:
        objectKey: { type: string, minLength: 1 }
        durationMs:
          type: integer
          minimum: 1
          description: |
            Measured by the browser from the file it just uploaded. Trusted
            only as far as the publish gate, which refuses a video whose last
            line ends after this — so a wrong duration cannot ship.

    ShadowPublishReport:
      type: object
      required: [published, blockers, warnings]
      properties:
        published:
          type: boolean
          description: False when a blocker stood, or when this was a dry run.
        blockers:
          type: array
          description: |
            Each refuses the publish, and each names the line it is about
            (TCCN-354-7).
          items: { type: string }
        warnings:
          type: array
          description: Reported, never blocking.
          items: { type: string }
